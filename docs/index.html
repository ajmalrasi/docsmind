e back. Two choices:<\/p>\n<ul><li><strong>Binary relevance<\/strong> — a chunk is relevant (1) or not (0). Simple. What<\/li><\/ul>\n<p>DocsMind uses.<\/p>\n<ul><li><strong>Graded relevance<\/strong> — degrees of relevance (perfect=3, related=1, off=0).<\/li><\/ul>\n<p>Richer, more work to label. Only <strong>NDCG<\/strong> uses grades naturally.<\/p>\n<p>And the granularity:<\/p>\n<ul><li><strong>Document-level<\/strong> — \"the answer is in <code>black_holes.md<\/code>.\" Cheap, reliable.<\/li><\/ul>\n<p>DocsMind uses this (source-level relevance).<\/p>\n<ul><li><strong>Passage-level<\/strong> — \"the answer is in <em>this exact chunk<\/em>.\" Stricter, more effort.<\/li><\/ul>\n<blockquote><p><strong>Interview signal:<\/strong> stating <em>which<\/em> labeling scheme you chose and <em>why<\/em> (\"document-level binary, because it's cheap and reliable; passage-level would be stricter\") shows you understand that label quality caps every metric below. A bad gold set makes every number meaningless.<\/p><\/blockquote>\n<h2 id=\"the-core-split-two-families-of-metrics\">The core split: two families of metrics<\/h2>\n<p>Every search metric answers one of two questions. Learn these two buckets and you have all of search evaluation:<\/p>\n<pre><code>Family 1 — DID WE FIND IT?       order-blind  (reorder the top-k, score unchanged)\nFamily 2 — DID WE RANK IT WELL?  order-aware  (reorder the top-k, score changes)<\/code><\/pre>\n<hr>\n<h2 id=\"family-1-set-metrics-order-doesnt-matter\">Family 1 — Set metrics (order doesn't matter)<\/h2>\n<p>These treat the top-k results as a <em>bag<\/em> and ask what's in it.<\/p>\n<h3 id=\"precisionk\">Precision@k<\/h3>\n<p>Of the k chunks I returned, how many were relevant?<\/p>\n<pre><code>Precision@k = (relevant in top k) / k<\/code><\/pre>\n<p>\"How much of what I showed was good?\" Punishes junk in the results.<\/p>\n<h3 id=\"recallk\">Recall@k<\/h3>\n<p>Of all the relevant chunks that exist, how many did I return?<\/p>\n<pre><code>Recall@k = (relevant in top k) / (total relevant)<\/code><\/pre>\n<p>\"How much of the good stuff did I gather?\"<\/p>\n<blockquote><p><strong>The ceiling catch:<\/strong> if a doc has 14 relevant chunks but k=5, the best possible Recall@5 is 5/14 ≈ 0.36. Low recall is often this cap, not failure — always read recall against its ceiling.<\/p><\/blockquote>\n<h3 id=\"f1k\">F1@k<\/h3>\n<p>Precision and recall pull against each other: return more chunks → recall up, precision down. <strong>F1<\/strong> is their balance (harmonic mean) — one number when you care about both.<\/p>\n<h3 id=\"hitk-hit-rate\">Hit@k (Hit Rate)<\/h3>\n<p>Did <em>at least one<\/em> relevant chunk make the top k? Yes/no, averaged over queries. The loosest, most forgiving set metric. DocsMind reports Hit@1 and Hit@3.<\/p>\n<hr>\n<h2 id=\"family-2-rank-aware-metrics-order-matters\">Family 2 — Rank-aware metrics (order matters)<\/h2>\n<p>These reward putting relevant chunks <strong>high<\/strong> — what you actually want in RAG, since you feed the LLM only the top few.<\/p>\n<h3 id=\"mrr-mean-reciprocal-rank\">MRR (Mean Reciprocal Rank)<\/h3>\n<p><code>1/rank<\/code> of the <em>first<\/em> relevant chunk, averaged over queries.<\/p>\n<pre><code>first relevant at rank 1 → 1.0 ;  rank 2 → 0.5 ;  rank 3 → 0.33<\/code><\/pre>\n<p>Only cares about the <strong>first<\/strong> hit. Perfect for \"I need one good chunk, fast.\"<\/p>\n<h3 id=\"map-mean-average-precision\">MAP (Mean Average Precision)<\/h3>\n<p>Builds on precision, and cares about <strong>all<\/strong> the hits:<\/p>\n<ol><li>Walk down the list. At each relevant chunk, compute Precision@(that position).<\/li><li>Average those → <strong>Average Precision<\/strong> for one query.<\/li><li>Average across queries → <strong>MAP<\/strong>.<\/li><\/ol>\n<p>MRR rewards the first hit; MAP rewards finding <em>many<\/em> relevant chunks <em>and<\/em> having them high.<\/p>\n<h3 id=\"ndcgk-normalized-discounted-cumulative-gain\">NDCG@k (Normalized Discounted Cumulative Gain)<\/h3>\n<p>The richest rank metric. Three ideas stacked:<\/p>\n<ul><li><strong>Gain<\/strong> — each result scores its relevance (1/0, or a grade).<\/li><li><strong>Discounted<\/strong> — a relevant chunk is worth less the lower it sits: <code>1/log2(rank+1)<\/code>.<\/li><\/ul>\n<p>Sum across the top k → <strong>DCG<\/strong>.<\/p>\n<ul><li><strong>Normalized<\/strong> — divide by the <em>ideal<\/em> ordering's DCG (<strong>IDCG<\/strong>) → a 0–1 score<\/li><\/ul>\n<p>where 1.0 = perfect ranking. Normalizing makes queries comparable.<\/p>\n<p>The only metric that handles <strong>graded<\/strong> relevance naturally.<\/p>\n<hr>\n<h2 id=\"the-cheat-sheet-pick-by-what-you-care-about\">The cheat-sheet — pick by what you care about<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>You care about…<\/th><th>Metric<\/th><th>Family<\/th><\/tr><\/thead><tbody><tr><td>Did I show mostly good chunks?<\/td><td>Precision@k<\/td><td>set<\/td><\/tr><tr><td>Did I gather all the good chunks?<\/td><td>Recall@k<\/td><td>set<\/td><\/tr><tr><td>Balance of the two?<\/td><td>F1@k<\/td><td>set<\/td><\/tr><tr><td>Did <em>anything<\/em> relevant show up?<\/td><td>Hit@k<\/td><td>set<\/td><\/tr><tr><td>Is the first good chunk near the top?<\/td><td>MRR<\/td><td>rank<\/td><\/tr><tr><td>Are good chunks high <em>and<\/em> did I find many?<\/td><td>MAP<\/td><td>rank<\/td><\/tr><tr><td>Best overall ranking (supports grades)?<\/td><td>NDCG@k<\/td><td>rank<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"the-big-lesson-metrics-encode-goals-and-they-disagree\">The big lesson: metrics encode goals, and they disagree<\/h2>\n<p>On DocsMind at <code>chunk_size=64<\/code>, rank metrics and set metrics <strong>disagreed<\/strong>: hybrid + rerank won on Hit@1 / MRR (floated the single best chunk to #1) but <em>lost<\/em> on Recall@5 / NDCG@5 (mixed in other-doc chunks, gathering fewer same-doc ones). See <a class=\"mdlink\" data-href=\"eval-results.md\" href=\"#\">eval-results.md<\/a> for the numbers.<\/p>\n<p>There's no single \"best\" — it depends what the LLM needs downstream:<\/p>\n<ul><li><strong>Pointed Q&amp;A<\/strong> (LLM reads the top 1–3 chunks) → optimize <strong>MRR / NDCG@k<\/strong>.<\/li><li><strong>Summarization / multi-hop<\/strong> (needs broad coverage) → weight <strong>Recall@k<\/strong>.<\/li><\/ul>\n<blockquote><p><strong>Interview signal — \"Which retrieval metric do you optimize?\"<\/strong> Weak answer: \"recall.\" Strong answer: <em>\"Depends on the task. Pointed Q&amp;A → MRR/NDCG, because order is everything when the LLM only reads the top few. Summarization → Recall@k for coverage. I report both so I see the tradeoff instead of hiding it.\"<\/em><\/p><\/blockquote>\n<h2 id=\"what-docsminds-eval-computes-today\">What DocsMind's eval computes today<\/h2>\n<p><code>scripts/retrieval_eval.py<\/code> currently prints <strong>Hit@1, Hit@3, MRR, Recall@k, NDCG@k<\/strong>. <strong>Precision@k<\/strong> and <strong>MAP<\/strong> are explained here but not yet coded — a natural next addition to complete the set-vs-rank picture.<\/p>\n<p>→ Results &amp; analysis: <a class=\"mdlink\" data-href=\"eval-results.md\" href=\"#\">eval-results.md<\/a> · Code: <code class=\"srcref\" title=\"source file in the repo\"><code>scripts/retrieval_eval.py<\/code><\/code><\/p>","toc":[{"level":2,"id":"step-0-you-need-labels-ground-truth","text":"Step 0 — you need labels (ground truth)"},{"level":2,"id":"the-core-split-two-families-of-metrics","text":"The core split: two families of metrics"},{"level":2,"id":"family-1-set-metrics-order-doesnt-matter","text":"Family 1 — Set metrics (order doesn't matter)"},{"level":3,"id":"precisionk","text":"Precision@k"},{"level":3,"id":"recallk","text":"Recall@k"},{"level":3,"id":"f1k","text":"F1@k"},{"level":3,"id":"hitk-hit-rate","text":"Hit@k (Hit Rate)"},{"level":2,"id":"family-2-rank-aware-metrics-order-matters","text":"Family 2 — Rank-aware metrics (order matters)"},{"level":3,"id":"mrr-mean-reciprocal-rank","text":"MRR (Mean Reciprocal Rank)"},{"level":3,"id":"map-mean-average-precision","text":"MAP (Mean Average Precision)"},{"level":3,"id":"ndcgk-normalized-discounted-cumulative-gain","text":"NDCG@k (Normalized Discounted Cumulative Gain)"},{"level":2,"id":"the-cheat-sheet-pick-by-what-you-care-about","text":"The cheat-sheet — pick by what you care about"},{"level":2,"id":"the-big-lesson-metrics-encode-goals-and-they-disagree","text":"The big lesson: metrics encode goals, and they disagree"},{"level":2,"id":"what-docsminds-eval-computes-today","text":"What DocsMind's eval computes today"}],"text":"search evaluation — the complete picture scope: this doc is about evaluating the search box only — did the right chunks come back, and were they ranked well? it stops before the llm. nothing here is about the answer's wording, correctness, or hallucination (that's answer/llm evaluation, a different box — phase 6). query → embed → [ search ] → rerank → generate → cite ▲ everything below grades only this box the real numbers these metrics produce on docsmind live in eval-results.md ; this doc is the concepts behind them. step 0 — you need labels (ground truth) you can't grade search without knowing what \"right\" is. every eval query needs a relevance label : which chunks (or docs) should come back. two choices: binary relevance — a chunk is relevant (1) or not (0). simple. what docsmind uses. graded relevance — degrees of relevance (perfect=3, related=1, off=0). richer, more work to label. only ndcg uses grades naturally. and the granularity: document-level — \"the answer is in black_holes.md .\" cheap, reliable. docsmind uses this (source-level relevance). passage-level — \"the answer is in this exact chunk .\" stricter, more effort. interview signal: stating which labeling scheme you chose and why (\"document-level binary, because it's cheap and reliable; passage-level would be stricter\") shows you understand that label quality caps every metric below. a bad gold set makes every number meaningless. the core split: two families of metrics every search metric answers one of two questions. learn these two buckets and you have all of search evaluation: family 1 — did we find it? order-blind (reorder the top-k, score unchanged) family 2 — did we rank it well? order-aware (reorder the top-k, score changes) family 1 — set metrics (order doesn't matter) these treat the top-k results as a bag and ask what's in it. precision@k of the k chunks i returned, how many were relevant? precision@k = (relevant in top k) / k \"how much of what i showed was good?\" punishes junk in the results. recall@k of all the relevant chunks that exist, how many did i return? recall@k = (relevant in top k) / (total relevant) \"how much of the good stuff did i gather?\" the ceiling catch: if a doc has 14 relevant chunks but k=5, the best possible recall@5 is 5/14 ≈ 0.36. low recall is often this cap, not failure — always read recall against its ceiling. f1@k precision and recall pull against each other: return more chunks → recall up, precision down. f1 is their balance (harmonic mean) — one number when you care about both. hit@k (hit rate) did at least one relevant chunk make the top k? yes/no, averaged over queries. the loosest, most forgiving set metric. docsmind reports hit@1 and hit@3. family 2 — rank-aware metrics (order matters) these reward putting relevant chunks high — what you actually want in rag, since you feed the llm only the top few. mrr (mean reciprocal rank) 1/rank of the first relevant chunk, averaged over queries. first relevant at rank 1 → 1.0 ; rank 2 → 0.5 ; rank 3 → 0.33 only cares about the first hit. perfect for \"i need one good chunk, fast.\" map (mean average precision) builds on precision, and cares about all the hits: walk down the list. at each relevant chunk, compute precision@(that position). average those → average precision for one query. average across queries → map . mrr rewards the first hit; map rewards finding many relevant chunks and having them high. ndcg@k (normalized discounted cumulative gain) the richest rank metric. three ideas stacked: gain — each result scores its relevance (1/0, or a grade). discounted — a relevant chunk is worth less the lower it sits: 1/log2(rank+1) . sum across the top k → dcg . normalized — divide by the ideal ordering's dcg ( idcg ) → a 0–1 score where 1.0 = perfect ranking. normalizing makes queries comparable. the only metric that handles graded relevance naturally. the cheat-sheet — pick by what you care about you care about… metric family did i show mostly good chunks? precision@k set did i gather all the good chunks? recall@k set balance of the two? f1@k set did anything relevant show up? hit@k set is the first good chunk near the top? mrr rank are good chunks high and did i find many? map rank best overall ranking (supports grades)? ndcg@k rank the big lesson: metrics encode goals, and they disagree on docsmind at chunk_size=64 , rank metrics and set metrics disagreed : hybrid + rerank won on hit@1 / mrr (floated the single best chunk to #1) but lost on recall@5 / ndcg@5 (mixed in other-doc chunks, gathering fewer same-doc ones). see eval-results.md for the numbers. there's no single \"best\" — it depends what the llm needs downstream: pointed q&a (llm reads the top 1–3 chunks) → optimize mrr / ndcg@k . summarization / multi-hop (needs broad coverage) → weight recall@k . interview signal — \"which retrieval metric do you optimize?\" weak answer: \"recall.\" strong answer: \"depends on the task. pointed q&a → mrr/ndcg, because order is everything when the llm only reads the top few. summarization → recall@k for coverage. i report both so i see the tradeoff instead of hiding it.\" what docsmind's eval computes today scripts/retrieval_eval.py currently prints hit@1, hit@3, mrr, recall@k, ndcg@k . precision@k and map are explained here but not yet coded — a natural next addition to complete the set-vs-rank picture. → results & analysis: eval-results.md · code: scripts/retrieval_eval.py","words":918},{"path":"09-hybrid-retrieval/eval-results.md","title":"Eval Results — Does Hybrid Win?","section":"9 · Hybrid Retrieval","quiz":false,"accent":"#19a4d1","html":"<h1 id=\"retrieval-eval-does-hybrid-rerank-actually-beat-dense\">Retrieval Eval — does hybrid + rerank actually beat dense?<\/h1>\n<p><strong>Where in the pipeline:<\/strong> this measures the <strong>Search<\/strong> stage directly. It runs dense, hybrid, and hybrid+rerank over the <em>same<\/em> corpus and the <em>same<\/em> labeled queries, and reports the same metrics for each. This is the evidence for the hardest Phase 3 interview question: <em>\"how did you know your retrieval improved?\"<\/em><\/p>\n<p>Script: <code class=\"srcref\" title=\"source file in the repo\"><code>scripts/retrieval_eval.py<\/code><\/code> · Query set: <code class=\"srcref\" title=\"source file in the repo\"><code>data/eval/retrieval_queries.json<\/code><\/code><\/p>\n<h2 id=\"the-setup\">The setup<\/h2>\n<p>15 labeled queries over the 5-doc space corpus. Each query is tagged with the doc that should answer it (<strong>source-level relevance<\/strong> — did we retrieve a chunk from the right doc?). The queries are a deliberate mix:<\/p>\n<ul><li><strong>exact-term<\/strong> queries (\"What is the Schwarzschild radius?\") — should favor BM25<\/li><li><strong>paraphrase<\/strong> queries (\"Why do astronauts appear weightless?\") — should favor dense<\/li><\/ul>\n<h3 id=\"the-metrics-plain-words\">The metrics (plain words)<\/h3>\n<blockquote><p>For the full framework behind these — the set-vs-rank split, Precision@k, MAP, and how ground-truth labels work — see <a class=\"mdlink\" data-href=\"search-evaluation.md\" href=\"#\">search-evaluation.md<\/a>. This section is just enough to read the tables below.<\/p><\/blockquote>\n<p>The first three care about the <strong>single best<\/strong> chunk. The last two care about <strong>all<\/strong> chunks from the correct doc (the \"relevant set\").<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>Metric<\/th><th>What it asks<\/th><th>Cares about<\/th><\/tr><\/thead><tbody><tr><td><strong>Hit@1<\/strong><\/td><td>Is the #1 result from the correct doc?<\/td><td>the top spot<\/td><\/tr><tr><td><strong>Hit@3<\/strong><\/td><td>Is the correct doc anywhere in the top 3?<\/td><td>being present<\/td><\/tr><tr><td><strong>MRR<\/strong><\/td><td><code>1/rank<\/code> of the <em>first<\/em> correct chunk, averaged. Rewards putting the right answer <em>higher<\/em>.<\/td><td>the first hit's rank<\/td><\/tr><tr><td><strong>Recall@k<\/strong><\/td><td>Of <em>all<\/em> the correct doc's chunks, what share landed in the top k?<\/td><td>gathering everything<\/td><\/tr><tr><td><strong>NDCG@k<\/strong><\/td><td>Like MRR but for many relevant items: rewards relevant chunks, discounted the lower they sit.<\/td><td>ranking the whole set well<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>One catch on Recall@k:<\/strong> if a doc produced 14 chunks but you only retrieve 5, the best possible Recall@5 is 5/14 ≈ 0.36 — you <em>can't<\/em> fit them all in 5 slots. So low recall numbers below aren't failure; read them against that ceiling.<\/p>\n<h2 id=\"results\">Results<\/h2>\n<h3 id=\"default-chunking-chunk_size512-5-chunks-one-per-doc\">Default chunking (chunk_size=512 → 5 chunks, one per doc)<\/h3>\n<pre><code>config             Hit@1   Hit@3     MRR     R@5   NDCG@5\n---------------------------------------------------------\ndense               0.93    1.00   0.967    1.00    0.975\nhybrid              0.93    1.00   0.967    1.00    0.975\nhybrid+rerank       1.00    1.00   1.000    1.00    1.000<\/code><\/pre>\n<p>With one chunk per doc, each relevant set is a single chunk, so Recall@5 is trivially 1.00. Dense already nearly maxes out and BM25 has nothing to <em>recover<\/em> — so <strong>hybrid == dense<\/strong>. The cross-encoder reranker still earns its place: it fixed the one query the others ranked #2, lifting Hit@1 to a perfect 1.00.<\/p>\n<h3 id=\"finer-chunking-chunk_size64-72-chunks-14-per-doc\">Finer chunking (chunk_size=64 → 72 chunks, ~14 per doc)<\/h3>\n<pre><code>config             Hit@1   Hit@3     MRR     R@5   NDCG@5\n---------------------------------------------------------\ndense               0.93    1.00   0.967    0.31    0.857\nhybrid              1.00    1.00   1.000    0.28    0.785\nhybrid+rerank       1.00    1.00   1.000    0.27    0.764<\/code><\/pre>\n<p>Now the metrics <strong>disagree<\/strong> — and that is the most valuable result here.<\/p>\n<ul><li><strong>Top-spot metrics say hybrid/rerank win.<\/strong> Hit@1 climbs 0.93 → 1.00, MRR<\/li><\/ul>\n<p>0.967 → 1.000. The concrete reason: the query <strong>\"What is left behind after a   supernova?\"<\/strong> — dense ranked the correct <code>stellar_lifecycle.md<\/code> chunk at <strong>#2<\/strong>;   BM25 caught the rare exact term <em>\"supernova\"<\/em> and RRF lifted it to <strong>#1<\/strong>.<\/p>\n<ul><li><strong>Coverage metrics say dense wins.<\/strong> Recall@5 drops 0.31 → 0.27 and NDCG@5 drops<\/li><\/ul>\n<p>0.857 → 0.764. Why? Dense pulls chunks from the <em>same<\/em> doc together (they're   semantically similar), so the top 5 is dominated by the correct doc. BM25 and the   reranker deliberately inject chunks from <em>other<\/em> docs that match on keywords or   pair-relevance — better single answer, but fewer same-doc chunks gathered.<\/p>\n<p>(Recall@5 looks low because each doc has ~14 chunks but only 5 fit in the top 5 — the ceiling is ~0.36, so dense's 0.31 is near-optimal coverage.)<\/p>\n<h2 id=\"the-honest-takeaways-this-is-the-senior-answer\">The honest takeaways (this is the senior answer)<\/h2>\n<ol><li><strong>The metrics measure different goals, and they can disagree.<\/strong> Hit@1/MRR ask<\/li><\/ol>\n<p><em>\"is the single best chunk on top?\"<\/em> Recall/NDCG ask <em>\"did we gather all the    relevant context?\"<\/em> Hybrid + rerank optimize the first and slightly hurt the    second. Which you want depends on the task: a pointed Q&amp;A wants Hit@1; a    summarization or multi-hop task wants recall.<\/p>\n<ol><li><strong>On a tiny, clean corpus, hybrid ≈ dense.<\/strong> There's nothing for BM25 to<\/li><\/ol>\n<p>recover when dense already nails it. The gain shows up once there are enough    competing chunks (and, at real scale, on jargon dense struggles with).<\/p>\n<ol><li><strong>Granularity matters.<\/strong> The <em>same<\/em> methods looked different at 5 vs 72 chunks.<\/li><\/ol>\n<p>Retrieval quality is a property of the <em>whole<\/em> pipeline (chunking included),    not one component.<\/p>\n<blockquote><p>The interview answer this unlocks: not <em>\"hybrid is better,\"<\/em> but <em>\"hybrid and the reranker improved Hit@1 and MRR by floating the single best chunk to the top — BM25 recovered an exact-term query dense ranked second — but they slightly lowered Recall@5 and NDCG@5 because they mix in other-doc chunks. Which tradeoff I want depends on whether the task needs the one best chunk or broad coverage.\"<\/em><\/p><\/blockquote>\n<h2 id=\"run-it-yourself\">Run it yourself<\/h2>\n<pre><code class=\"language-bash\"><span class=\"tok-command\">make<\/span> eval                              <span class=\"tok-comment\"># dense vs hybrid (fast, embedder only)<\/span>\n<span class=\"tok-command\">make<\/span> eval ARGS=<span class=\"tok-flag\">--rerank<\/span>                <span class=\"tok-comment\"># add the cross-encoder<\/span>\n<span class=\"tok-command\">make<\/span> beast-eval                        <span class=\"tok-comment\"># full run with rerank on the GPU<\/span>\n<span class=\"tok-command\">python<\/span> <span class=\"tok-flag\">-m<\/span> scripts.retrieval_eval <span class=\"tok-flag\">--rerank<\/span> <span class=\"tok-flag\">--chunk-size<\/span> <span class=\"tok-number\">64<\/span>   <span class=\"tok-comment\"># the finer-grained run<\/span><\/code><\/pre>\n<h2 id=\"whats-still-missing\">What's still missing<\/h2>\n<p>This measures <em>retrieval<\/em> (did we fetch the right chunks?). It does <strong>not<\/strong> yet measure <em>answer<\/em> quality (faithfulness, hallucination) — that's Phase 6 (RAGAS / DeepEval), which grades the LLM's output, not the retriever's.<\/p>","toc":[{"level":2,"id":"the-setup","text":"The setup"},{"level":3,"id":"the-metrics-plain-words","text":"The metrics (plain words)"},{"level":2,"id":"results","text":"Results"},{"level":3,"id":"default-chunking-chunk_size512-5-chunks-one-per-doc","text":"Default chunking (chunk_size=512 → 5 chunks, one per doc)"},{"level":3,"id":"finer-chunking-chunk_size64-72-chunks-14-per-doc","text":"Finer chunking (chunk_size=64 → 72 chunks, ~14 per doc)"},{"level":2,"id":"the-honest-takeaways-this-is-the-senior-answer","text":"The honest takeaways (this is the senior answer)"},{"level":2,"id":"run-it-yourself","text":"Run it yourself"},{"level":2,"id":"whats-still-missing","text":"What's still missing"}],"text":"retrieval eval — does hybrid + rerank actually beat dense? where in the pipeline: this measures the search stage directly. it runs dense, hybrid, and hybrid+rerank over the same corpus and the same labeled queries, and reports the same metrics for each. this is the evidence for the hardest phase 3 interview question: \"how did you know your retrieval improved?\" script: scripts/retrieval_eval.py · query set: data/eval/retrieval_queries.json the setup 15 labeled queries over the 5-doc space corpus. each query is tagged with the doc that should answer it ( source-level relevance — did we retrieve a chunk from the right doc?). the queries are a deliberate mix: exact-term queries (\"what is the schwarzschild radius?\") — should favor bm25 paraphrase queries (\"why do astronauts appear weightless?\") — should favor dense the metrics (plain words) for the full framework behind these — the set-vs-rank split, precision@k, map, and how ground-truth labels work — see search-evaluation.md . this section is just enough to read the tables below. the first three care about the single best chunk. the last two care about all chunks from the correct doc (the \"relevant set\"). metric what it asks cares about hit@1 is the #1 result from the correct doc? the top spot hit@3 is the correct doc anywhere in the top 3? being present mrr 1/rank of the first correct chunk, averaged. rewards putting the right answer higher . the first hit's rank recall@k of all the correct doc's chunks, what share landed in the top k? gathering everything ndcg@k like mrr but for many relevant items: rewards relevant chunks, discounted the lower they sit. ranking the whole set well one catch on recall@k: if a doc produced 14 chunks but you only retrieve 5, the best possible recall@5 is 5/14 ≈ 0.36 — you can't fit them all in 5 slots. so low recall numbers below aren't failure; read them against that ceiling. results default chunking (chunk_size=512 → 5 chunks, one per doc) config hit@1 hit@3 mrr r@5 ndcg@5 --------------------------------------------------------- dense 0.93 1.00 0.967 1.00 0.975 hybrid 0.93 1.00 0.967 1.00 0.975 hybrid+rerank 1.00 1.00 1.000 1.00 1.000 with one chunk per doc, each relevant set is a single chunk, so recall@5 is trivially 1.00. dense already nearly maxes out and bm25 has nothing to recover — so hybrid == dense . the cross-encoder reranker still earns its place: it fixed the one query the others ranked #2, lifting hit@1 to a perfect 1.00. finer chunking (chunk_size=64 → 72 chunks, ~14 per doc) config hit@1 hit@3 mrr r@5 ndcg@5 --------------------------------------------------------- dense 0.93 1.00 0.967 0.31 0.857 hybrid 1.00 1.00 1.000 0.28 0.785 hybrid+rerank 1.00 1.00 1.000 0.27 0.764 now the metrics disagree — and that is the most valuable result here. top-spot metrics say hybrid/rerank win. hit@1 climbs 0.93 → 1.00, mrr 0.967 → 1.000. the concrete reason: the query \"what is left behind after a supernova?\" — dense ranked the correct stellar_lifecycle.md chunk at #2 ; bm25 caught the rare exact term \"supernova\" and rrf lifted it to #1 . coverage metrics say dense wins. recall@5 drops 0.31 → 0.27 and ndcg@5 drops 0.857 → 0.764. why? dense pulls chunks from the same doc together (they're semantically similar), so the top 5 is dominated by the correct doc. bm25 and the reranker deliberately inject chunks from other docs that match on keywords or pair-relevance — better single answer, but fewer same-doc chunks gathered. (recall@5 looks low because each doc has ~14 chunks but only 5 fit in the top 5 — the ceiling is ~0.36, so dense's 0.31 is near-optimal coverage.) the honest takeaways (this is the senior answer) the metrics measure different goals, and they can disagree. hit@1/mrr ask \"is the single best chunk on top?\" recall/ndcg ask \"did we gather all the relevant context?\" hybrid + rerank optimize the first and slightly hurt the second. which you want depends on the task: a pointed q&a wants hit@1; a summarization or multi-hop task wants recall. on a tiny, clean corpus, hybrid ≈ dense. there's nothing for bm25 to recover when dense already nails it. the gain shows up once there are enough competing chunks (and, at real scale, on jargon dense struggles with). granularity matters. the same methods looked different at 5 vs 72 chunks. retrieval quality is a property of the whole pipeline (chunking included), not one component. the interview answer this unlocks: not \"hybrid is better,\" but \"hybrid and the reranker improved hit@1 and mrr by floating the single best chunk to the top — bm25 recovered an exact-term query dense ranked second — but they slightly lowered recall@5 and ndcg@5 because they mix in other-doc chunks. which tradeoff i want depends on whether the task needs the one best chunk or broad coverage.\" run it yourself make eval # dense vs hybrid (fast, embedder only) make eval args= --rerank # add the cross-encoder make beast-eval # full run with rerank on the gpu python -m scripts.retrieval_eval --rerank --chunk-size 64 # the finer-grained run what's still missing this measures retrieval (did we fetch the right chunks?). it does not yet measure answer quality (faithfulness, hallucination) — that's phase 6 (ragas / deepeval), which grades the llm's output, not the retriever's.","words":867},{"path":"10-qdrant/README.md","title":"Overview","section":"10 · Qdrant","quiz":false,"accent":"#b5651d","html":"<h1 id=\"qdrant-a-vector-store-you-talk-to-not-one-you-embed-phase-2b\">Qdrant — a vector store you talk to, not one you embed (Phase 2b)<\/h1>\n<div class=\"callout tldr\"><div class=\"cic\">💡<\/div><div class=\"cbody\"><span class=\"clead\">TL;DR<\/span> FAISS lives <em>inside<\/em> your program (a notebook on your desk). Qdrant is a <em>separate service<\/em> you talk to over the network (a librarian in another room). Both store vectors and find nearest neighbors. The difference is operational, not about raw speed.<\/div><\/div>\n<h2 id=\"where-this-lives-in-the-pipeline\">Where this lives in the pipeline<\/h2>\n<p>Phase 2b only swaps the <strong>Index<\/strong> box. Same <code>VectorStore<\/code> contract, so the retriever and pipeline never learn which backend is underneath.<\/p>\n<pre><code>Ingest → Chunk → Embed → [ INDEX: faiss | qdrant ] → Search → Generate\n                              ▲\n                  the only thing that changes<\/code><\/pre>\n<h2 id=\"embedded-vs-service-the-core-idea\">Embedded vs. service (the core idea)<\/h2>\n<p><strong>FAISS = embedded.<\/strong> \"Embedded\" means it runs <em>inside your own Python process<\/em>. The vectors sit in this program's memory and get written to a file. Fast to search, but only this one process can read them at a time.<\/p>\n<p><strong>Qdrant = a service.<\/strong> It's a separate program. You send it \"find the closest vectors to this one\" over HTTP, it does the work and sends results back. DocsMind runs it in one of two modes:<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>Mode<\/th><th>What it is<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td><strong>local-path<\/strong><\/td><td>Qdrant persists to a directory on disk, no server process<\/td><td>Default — keeps tests and <code>make demo<\/code> offline<\/td><\/tr><tr><td><strong>server (URL)<\/strong><\/td><td>A Dockerized Qdrant reachable over HTTP (e.g. on beast)<\/td><td>The \"real\" deployment shape<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Set <code>qdrant_url<\/code> to use the server; leave it empty for local-path.<\/p>\n<h2 id=\"why-move-to-a-service-at-all\">Why move to a service at all?<\/h2>\n<p><strong>Not for speed<\/strong> — that's the common wrong answer. The reasons are operational:<\/p>\n<ul><li><strong>Concurrency.<\/strong> Many copies of your API can query the <em>same<\/em> Qdrant at once.<\/li><\/ul>\n<p>With FAISS, each process needs its own copy of the index in memory.<\/p>\n<ul><li><strong>Live updates.<\/strong> Qdrant supports adding/deleting vectors on the fly. A FAISS<\/li><\/ul>\n<p>flat index is rebuilt to change.<\/p>\n<ul><li><strong>Metadata filtering.<\/strong> Qdrant can filter while it searches (\"only docs from<\/li><\/ul>\n<p>2024\"), using the payload stored next to each vector.<\/p>\n<blockquote><p>You reach for Qdrant when the index <strong>outgrows a single process<\/strong> — not when search feels slow.<\/p><\/blockquote>\n<h2 id=\"one-technical-contrast-to-keep\">One technical contrast to keep<\/h2>\n<p>Qdrant builds an <strong>HNSW<\/strong> graph for every collection by default — so its search is <strong>approximate<\/strong> out of the box. FAISS <code>flat<\/code> (the Phase 1 default) is <strong>exact<\/strong>. Just by switching backends, you traded exact answers for fast-approximate ones. (HNSW is the same graph index covered in <a class=\"mdlink\" data-href=\"../05-faiss/\" href=\"#\">05-faiss<\/a>.)<\/p>\n<h2 id=\"how-its-wired\">How it's wired<\/h2>\n<ul><li><code>QdrantVectorStore<\/code> (<code class=\"srcref\" title=\"source file in the repo\"><code>qdrant_store.py<\/code><\/code>)<\/li><\/ul>\n<p>implements the same <code>add / search / save / size / index_type / chunks<\/code> contract   as <code>FaissVectorStore<\/code>.<\/p>\n<ul><li>The <code>vector_backend<\/code> setting (<code>\"faiss\"<\/code> default / <code>\"qdrant\"<\/code>) selects it in the<\/li><\/ul>\n<p>factory. Switch with <code>DOCSMIND_VECTOR_BACKEND=qdrant<\/code> and re-ingest.<\/p>\n<ul><li>Vectors use <strong>cosine<\/strong> distance. Our embeddings are already L2-normalized, so<\/li><\/ul>\n<p>cosine and dot product agree.<\/p>\n<ul><li>Point payloads carry the full chunk (id, text, source, metadata), so search<\/li><\/ul>\n<p>results and the BM25 corpus can be rebuilt straight from Qdrant.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>Why move from FAISS to Qdrant?<\/strong> Operations, not performance: concurrent<\/li><\/ul>\n<p>access across API replicas, live upserts, metadata filtering. FAISS is one   process's memory; Qdrant is a shared service.<\/p>\n<ul><li><strong>What did it cost?<\/strong> A network hop per query, a service to run and monitor, and<\/li><\/ul>\n<p>you gave up FAISS's exact <code>flat<\/code> for Qdrant's approximate HNSW.<\/p>\n<ul><li><strong>How did you keep tests offline?<\/strong> Local-path / in-memory Qdrant — no server<\/li><\/ul>\n<p>needed, same code path.<\/p>\n<p>→ Code: <code class=\"srcref\" title=\"source file in the repo\"><code>qdrant_store.py<\/code><\/code> · Interface: <code class=\"srcref\" title=\"source file in the repo\"><code>base.py<\/code><\/code><\/p>","toc":[{"level":2,"id":"where-this-lives-in-the-pipeline","text":"Where this lives in the pipeline"},{"level":2,"id":"embedded-vs-service-the-core-idea","text":"Embedded vs. service (the core idea)"},{"level":2,"id":"why-move-to-a-service-at-all","text":"Why move to a service at all?"},{"level":2,"id":"one-technical-contrast-to-keep","text":"One technical contrast to keep"},{"level":2,"id":"how-its-wired","text":"How it's wired"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"qdrant — a vector store you talk to, not one you embed (phase 2b) 💡 tl;dr faiss lives inside your program (a notebook on your desk). qdrant is a separate service you talk to over the network (a librarian in another room). both store vectors and find nearest neighbors. the difference is operational, not about raw speed. where this lives in the pipeline phase 2b only swaps the index box. same vectorstore contract, so the retriever and pipeline never learn which backend is underneath. ingest → chunk → embed → [ index: faiss | qdrant ] → search → generate ▲ the only thing that changes embedded vs. service (the core idea) faiss = embedded. \"embedded\" means it runs inside your own python process . the vectors sit in this program's memory and get written to a file. fast to search, but only this one process can read them at a time. qdrant = a service. it's a separate program. you send it \"find the closest vectors to this one\" over http, it does the work and sends results back. docsmind runs it in one of two modes: mode what it is when local-path qdrant persists to a directory on disk, no server process default — keeps tests and make demo offline server (url) a dockerized qdrant reachable over http (e.g. on beast) the \"real\" deployment shape set qdrant_url to use the server; leave it empty for local-path. why move to a service at all? not for speed — that's the common wrong answer. the reasons are operational: concurrency. many copies of your api can query the same qdrant at once. with faiss, each process needs its own copy of the index in memory. live updates. qdrant supports adding/deleting vectors on the fly. a faiss flat index is rebuilt to change. metadata filtering. qdrant can filter while it searches (\"only docs from 2024\"), using the payload stored next to each vector. you reach for qdrant when the index outgrows a single process — not when search feels slow. one technical contrast to keep qdrant builds an hnsw graph for every collection by default — so its search is approximate out of the box. faiss flat (the phase 1 default) is exact . just by switching backends, you traded exact answers for fast-approximate ones. (hnsw is the same graph index covered in 05-faiss .) how it's wired qdrantvectorstore ( qdrant_store.py ) implements the same add / search / save / size / index_type / chunks contract as faissvectorstore . the vector_backend setting ( \"faiss\" default / \"qdrant\" ) selects it in the factory. switch with docsmind_vector_backend=qdrant and re-ingest. vectors use cosine distance. our embeddings are already l2-normalized, so cosine and dot product agree. point payloads carry the full chunk (id, text, source, metadata), so search results and the bm25 corpus can be rebuilt straight from qdrant. the interview signals why move from faiss to qdrant? operations, not performance: concurrent access across api replicas, live upserts, metadata filtering. faiss is one process's memory; qdrant is a shared service. what did it cost? a network hop per query, a service to run and monitor, and you gave up faiss's exact flat for qdrant's approximate hnsw. how did you keep tests offline? local-path / in-memory qdrant — no server needed, same code path. → code: qdrant_store.py · interface: base.py","words":555},{"path":"11-hyde/README.md","title":"HyDE — Search With a Fake Answer","section":"11 · HyDE (Concept)","quiz":false,"accent":"","html":"<h1 id=\"hyde-search-with-a-fake-answer-concept-phase-5\">HyDE — search with a fake answer (concept, Phase 5)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> the <strong>query side<\/strong> of Search — between receiving the question and embedding it. Everything downstream (index, fusion, rerank) is untouched. Not built in DocsMind yet; it's a Phase 5 (agent) technique. This page exists so the concept is mapped before the code lands.<\/p>\n<pre><code>                 today:  question ────────────→ embed → search\n                  HyDE:  question → LLM writes a\n                         hypothetical answer ──→ embed → search<\/code><\/pre>\n<h2 id=\"the-problem-it-solves\">The problem it solves<\/h2>\n<p>At query time we currently embed the <strong>question<\/strong> and hunt for nearby chunks. But questions and answers are <em>different kinds of text<\/em>. \"Why do astronauts float?\" is short, interrogative, and contains none of the vocabulary of the passage that answers it (microgravity, free fall, orbital velocity). The question's vector sits in a slightly wrong neighborhood — we're searching for a thing shaped like a question in an index full of things shaped like answers.<\/p>\n<h2 id=\"the-fix\">The fix<\/h2>\n<p><strong>HyDE — Hypothetical Document Embeddings.<\/strong> Ask an LLM to <em>write a fake answer first<\/em>, embed <strong>that<\/strong>, and search with it.<\/p>\n<p>The fake answer may be factually wrong — doesn't matter. It's the right <em>kind<\/em> of text: declarative, answer-shaped, full of the domain vocabulary that real answer chunks also use. Its vector lands in the answer neighborhood, and nearest-neighbor search does the rest. The retrieved chunks are real; the fake answer is thrown away before generation.<\/p>\n<p>Plain version: instead of describing a suspect to the sketch artist, you draw the sketch yourself — badly — and match it against the photo database. A bad sketch of the right face beats a perfect description in the wrong medium.<\/p>\n<h2 id=\"where-it-will-slot-into-the-real-code\">Where it will slot into the real code<\/h2>\n<p>One seam: <code>HybridRetriever.retrieve()<\/code> in <code class=\"srcref\" title=\"source file in the repo\"><code>retriever.py<\/code><\/code> currently embeds <code>question<\/code> directly. HyDE inserts one LLM call before that embed:<\/p>\n<pre><code class=\"language-python\">hypothetical = llm.generate(<span class=\"tok-string\">f\"Write a short passage answering: {question}\"<\/span>)\nquery_vec = embedder.embed(hypothetical)   <span class=\"tok-comment\"># instead of embed(question)<\/span><\/code><\/pre>\n<p>Note what this costs: <strong>an extra LLM call before retrieval even starts<\/strong> — added latency and tokens on every query. That's why it belongs in Phase 5's agent, which can <em>decide<\/em> when to use it, rather than being always-on.<\/p>\n<h2 id=\"trade-offs-the-interview-meat\">Trade-offs (the interview meat)<\/h2>\n<ul><li><strong>Cost:<\/strong> one LLM round-trip per query, on the critical path, before any<\/li><\/ul>\n<p>search happens. Streaming can't hide it.<\/p>\n<ul><li><strong>Risk:<\/strong> if the LLM's fake answer is off-topic (ambiguous question, or a<\/li><\/ul>\n<p>topic the model knows nothing about), you've <em>steered retrieval wrong<\/em> —   worse than the plain question. HyDE amplifies the LLM's prior, good or bad.<\/p>\n<ul><li><strong>When it shines:<\/strong> short vague questions over a corpus with strong domain<\/li><\/ul>\n<p>vocabulary; zero-shot setups with no labeled data to fine-tune retrievers.<\/p>\n<ul><li><strong>When to skip it:<\/strong> queries that already share vocabulary with the docs<\/li><\/ul>\n<p>(keyword-ish questions — BM25 covers those in hybrid), or strict latency   budgets.<\/p>\n<ul><li><strong>How you'd validate it:<\/strong> the same harness as Phase 3 — add a <code>hyde<\/code><\/li><\/ul>\n<p>config to <code>scripts/retrieval_eval.py<\/code>, run the same 15 labeled queries,   compare Hit@1/MRR against dense and hybrid. No new machinery needed; that's   the payoff of having built the eval first.<\/p>\n<h2 id=\"same-family-different-tricks-phase-5-preview\">Same family, different tricks (Phase 5 preview)<\/h2>\n<p>HyDE is one of several <strong>query transformations<\/strong> — all living at the same \"rewrite the query before search\" stage:<\/p>\n<ul><li><strong>Multi-Query:<\/strong> rephrase the question N ways, search all, fuse with RRF<\/li><\/ul>\n<p>(the same fusion already built in Phase 3).<\/p>\n<ul><li><strong>Decomposition:<\/strong> split a multi-hop question into sub-questions, retrieve<\/li><\/ul>\n<p>per sub-question.<\/p>\n<ul><li><strong>HyDE:<\/strong> transform the question into answer-shaped text (this page).<\/li><\/ul>\n<p>Same seam, same eval, different rewrite. When Phase 5 lands, each gets the full treatment.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>What is HyDE, in one line?<\/strong> Embed a hypothetical answer instead of the<\/li><\/ul>\n<p>question, because answers live near answers in embedding space.<\/p>\n<ul><li>**Why does a <em>wrong<\/em> fake answer still work?** Retrieval only needs the<\/li><\/ul>\n<p>vector to land in the right neighborhood — vocabulary and shape put it   there; factual precision doesn't matter because the fake text is discarded.<\/p>\n<ul><li><strong>When does it backfire?<\/strong> Off-topic hypothetical → confidently wrong<\/li><\/ul>\n<p>retrieval, plus an LLM call of latency on every query. You A/B it on a   labeled eval set before turning it on — never by vibes.<\/p>","toc":[{"level":2,"id":"the-problem-it-solves","text":"The problem it solves"},{"level":2,"id":"the-fix","text":"The fix"},{"level":2,"id":"where-it-will-slot-into-the-real-code","text":"Where it will slot into the real code"},{"level":2,"id":"trade-offs-the-interview-meat","text":"Trade-offs (the interview meat)"},{"level":2,"id":"same-family-different-tricks-phase-5-preview","text":"Same family, different tricks (Phase 5 preview)"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"hyde — search with a fake answer (concept, phase 5) where in the pipeline: the query side of search — between receiving the question and embedding it. everything downstream (index, fusion, rerank) is untouched. not built in docsmind yet; it's a phase 5 (agent) technique. this page exists so the concept is mapped before the code lands. today: question ────────────→ embed → search hyde: question → llm writes a hypothetical answer ──→ embed → search the problem it solves at query time we currently embed the question and hunt for nearby chunks. but questions and answers are different kinds of text . \"why do astronauts float?\" is short, interrogative, and contains none of the vocabulary of the passage that answers it (microgravity, free fall, orbital velocity). the question's vector sits in a slightly wrong neighborhood — we're searching for a thing shaped like a question in an index full of things shaped like answers. the fix hyde — hypothetical document embeddings. ask an llm to write a fake answer first , embed that , and search with it. the fake answer may be factually wrong — doesn't matter. it's the right kind of text: declarative, answer-shaped, full of the domain vocabulary that real answer chunks also use. its vector lands in the answer neighborhood, and nearest-neighbor search does the rest. the retrieved chunks are real; the fake answer is thrown away before generation. plain version: instead of describing a suspect to the sketch artist, you draw the sketch yourself — badly — and match it against the photo database. a bad sketch of the right face beats a perfect description in the wrong medium. where it will slot into the real code one seam: hybridretriever.retrieve() in retriever.py currently embeds question directly. hyde inserts one llm call before that embed: hypothetical = llm.generate( f\"write a short passage answering: {question}\" ) query_vec = embedder.embed(hypothetical) # instead of embed(question) note what this costs: an extra llm call before retrieval even starts — added latency and tokens on every query. that's why it belongs in phase 5's agent, which can decide when to use it, rather than being always-on. trade-offs (the interview meat) cost: one llm round-trip per query, on the critical path, before any search happens. streaming can't hide it. risk: if the llm's fake answer is off-topic (ambiguous question, or a topic the model knows nothing about), you've steered retrieval wrong — worse than the plain question. hyde amplifies the llm's prior, good or bad. when it shines: short vague questions over a corpus with strong domain vocabulary; zero-shot setups with no labeled data to fine-tune retrievers. when to skip it: queries that already share vocabulary with the docs (keyword-ish questions — bm25 covers those in hybrid), or strict latency budgets. how you'd validate it: the same harness as phase 3 — add a hyde config to scripts/retrieval_eval.py , run the same 15 labeled queries, compare hit@1/mrr against dense and hybrid. no new machinery needed; that's the payoff of having built the eval first. same family, different tricks (phase 5 preview) hyde is one of several query transformations — all living at the same \"rewrite the query before search\" stage: multi-query: rephrase the question n ways, search all, fuse with rrf (the same fusion already built in phase 3). decomposition: split a multi-hop question into sub-questions, retrieve per sub-question. hyde: transform the question into answer-shaped text (this page). same seam, same eval, different rewrite. when phase 5 lands, each gets the full treatment. the interview signals what is hyde, in one line? embed a hypothetical answer instead of the question, because answers live near answers in embedding space. **why does a wrong fake answer still work?** retrieval only needs the vector to land in the right neighborhood — vocabulary and shape put it there; factual precision doesn't matter because the fake text is discarded. when does it backfire? off-topic hypothetical → confidently wrong retrieval, plus an llm call of latency on every query. you a/b it on a labeled eval set before turning it on — never by vibes.","words":677},{"path":"12-tool-calling/README.md","title":"Tool Calling — The LLM Asks, Your Code Answers","section":"12 · Tool Calling","quiz":false,"accent":"","html":"<h1 id=\"tool-calling-the-llm-asks-your-code-answers-concept-phase-5\">Tool calling — the LLM asks, your code answers (concept, Phase 5)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> between <strong>Generate<\/strong> and <strong>Cite<\/strong> — actually, it replaces the assumption that Generate is a single LLM call at all. Right now <code>RAGPipeline.query()<\/code> does one retrieve, one generate, done. Tool calling turns that one step into a <strong>loop<\/strong>: the LLM can ask for more information mid-answer instead of only working with what retrieval handed it upfront. Not built in DocsMind yet; it's the core mechanic Phase 5's agent needs.<\/p>\n<pre><code>today:     question → retrieve(top_k) → ONE generate call → answer\n\ntool calling:  question → generate call ──┬─→ model says \"call retrieve('x')\"\n                                           │        ↓\n                                           │   your code runs it, returns result\n                                           │        ↓\n                                           └─→ generate call again, sees result\n                                                    ↓ (repeat until model is done)\n                                                 final answer<\/code><\/pre>\n<h2 id=\"the-problem-it-solves\">The problem it solves<\/h2>\n<p>Right now, <code>RAGPipeline.query()<\/code> decides <em>once<\/em>, before the LLM ever runs, what context the model gets: <code>self._retriever.retrieve(question, top_k)<\/code>. If the first retrieval was too narrow, wrong <code>top_k<\/code>, or the question actually needs two lookups (e.g. \"compare X and Y\" needing two separate searches), the model has no way to ask for more. It just answers with what it got, or says <code>INSUFFICIENT_CONTEXT<\/code>.<\/p>\n<p>Tool calling gives the model a <strong>menu of functions it's allowed to invoke<\/strong>, described to it as a schema (name, description, JSON parameters) — not code, just a spec. The model doesn't execute anything. It outputs a structured request like <code>{\"name\": \"retrieve\", \"arguments\": {\"query\": \"supernova types\"}}<\/code>. Your code is the one that actually runs <code>retrieve()<\/code>, and feeds the result back in as another message. The model then continues, possibly calling another tool, until it decides it has enough to answer in plain text.<\/p>\n<p>Plain version: the model is a customer at a counter, not the cook. It doesn't walk into the kitchen — it places an order in a fixed format, and <em>you<\/em> bring back what it asked for. It never touches the stove.<\/p>\n<h2 id=\"where-it-would-slot-into-the-real-code\">Where it would slot into the real code<\/h2>\n<p>Two places, and the seam is worth naming precisely:<\/p>\n<p><strong>1. The LLM client contract.<\/strong> <code>CloudLLMClient.generate()<\/code> in <code class=\"srcref\" title=\"source file in the repo\"><code>cloud_client.py<\/code><\/code> currently makes one <code>messages.create()<\/code> call with <code>system<\/code> + <code>prompt<\/code> and returns plain text. Tool calling needs the Anthropic <code>tools=[...]<\/code> parameter added to that call, and the return type widened from <code>str<\/code> to \"either a text answer, or a tool-use request with a name and arguments\" — the <code>LLMClient<\/code> interface itself changes shape.<\/p>\n<p><strong>2. The control loop.<\/strong> Nothing in <code>docsmind/<\/code> currently <em>loops<\/em> on a model's response — <code>RAGPipeline.query()<\/code> calls the LLM exactly once. The loop (call model → check if it asked for a tool → run the tool → call model again) is new machinery. That loop, plus a registry of callable tools (<code>retrieve<\/code>, maybe <code>web_search<\/code>, <code>code_exec<\/code>), is what <code>docsmind/agent/__init__.py<\/code> — today just a docstring — is a placeholder for.<\/p>\n<pre><code class=\"language-python\"><span class=\"tok-comment\"># sketch of the shape, not real code yet<\/span>\ntools = [{<span class=\"tok-string\">\"name\"<\/span>: <span class=\"tok-string\">\"retrieve\"<\/span>, <span class=\"tok-string\">\"description\"<\/span>: <span class=\"tok-string\">\"...\"<\/span>, <span class=\"tok-string\">\"input_schema\"<\/span>: {...}}]\n<span class=\"tok-keyword\">while<\/span> <span class=\"tok-keyword\">True<\/span>:\n    response = llm.generate_with_tools(system, messages, tools)\n    <span class=\"tok-keyword\">if<\/span> response.stop_reason != <span class=\"tok-string\">\"tool_use\"<\/span>:\n        <span class=\"tok-keyword\">return<\/span> response.text  <span class=\"tok-comment\"># model is done<\/span>\n    result = TOOL_REGISTRY[response.tool_name](**response.tool_input)\n    messages.append(tool_result_message(response.tool_use_id, result))<\/code><\/pre>\n<h2 id=\"trade-offs-the-interview-meat\">Trade-offs (the interview meat)<\/h2>\n<ul><li><strong>Cost:<\/strong> every tool call is a full extra round-trip to the LLM — more<\/li><\/ul>\n<p>tokens, more latency, and no clean upper bound on how many round-trips a   question takes. You need a max-iterations guard or the loop can run forever   on an ambiguous question.<\/p>\n<ul><li><strong>Reliability, not just capability.<\/strong> The hard part isn't wiring the API —<\/li><\/ul>\n<p>it's the model reliably emitting well-formed arguments that match your JSON   schema, every time, including for oddly-phrased questions. This is exactly   where <strong>closed models are strong and open models often regress<\/strong> — schema   drift, malformed JSON, calling the wrong tool. That gap, and how you close it   (better prompting, few-shot examples of correct calls, or constrained   decoding — see the interview-depth note below), is the single highest-signal   thing to be able to talk through for an inference/serving role.<\/p>\n<ul><li><strong>Security surface:<\/strong> the model is now choosing what code runs and with what<\/li><\/ul>\n<p>arguments. Any tool that touches the filesystem, a shell, or an external API   needs its own validation — never trust <code>response.tool_input<\/code> as safe just   because it came from a schema. See <a class=\"mdlink\" data-href=\"../18-llm-security/README.md\" href=\"#\"><code>18-llm-security<\/code><\/a>.<\/p>\n<ul><li><strong>How you'd validate it:<\/strong> track tool-call success rate separately from<\/li><\/ul>\n<p>answer quality — did the model call the <em>right<\/em> tool, with <em>valid<\/em>   arguments, in <em>one<\/em> call rather than three retries? That's a distinct metric   from \"was the final answer correct,\" and it's the one that breaks first when   you swap models.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>What is tool calling, in one line?<\/strong> The model requests a function by name<\/li><\/ul>\n<p>and arguments; your code executes it and hands the result back — the model   never runs anything itself.<\/p>\n<ul><li><strong>Why can't the model just call the function directly?<\/strong> It has no execution<\/li><\/ul>\n<p>environment. It only emits text (structured as JSON here). Every \"action\" an   LLM takes in the world is actually your code, triggered by a message it   wrote.<\/p>\n<ul><li><strong>What's the failure mode that actually shows up in production?<\/strong> Not \"the<\/li><\/ul>\n<p>model refuses to use a tool\" — it's <strong>malformed or wrong-tool calls<\/strong>,   especially after swapping to a smaller or open-weight model. This is a   known, measurable regression (see <code>15-llm-serving-internals<\/code> for the serving   side and the DocsMind roadmap's Auric-target note on this exact gap) — the   fix path is prompting first, then structured-output constraints   (Outlines/XGrammar), then fine-tuning as a last resort, in that order of   cost.<\/p>","toc":[{"level":2,"id":"the-problem-it-solves","text":"The problem it solves"},{"level":2,"id":"where-it-would-slot-into-the-real-code","text":"Where it would slot into the real code"},{"level":2,"id":"trade-offs-the-interview-meat","text":"Trade-offs (the interview meat)"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"tool calling — the llm asks, your code answers (concept, phase 5) where in the pipeline: between generate and cite — actually, it replaces the assumption that generate is a single llm call at all. right now ragpipeline.query() does one retrieve, one generate, done. tool calling turns that one step into a loop : the llm can ask for more information mid-answer instead of only working with what retrieval handed it upfront. not built in docsmind yet; it's the core mechanic phase 5's agent needs. today: question → retrieve(top_k) → one generate call → answer tool calling: question → generate call ──┬─→ model says \"call retrieve('x')\" │ ↓ │ your code runs it, returns result │ ↓ └─→ generate call again, sees result ↓ (repeat until model is done) final answer the problem it solves right now, ragpipeline.query() decides once , before the llm ever runs, what context the model gets: self._retriever.retrieve(question, top_k) . if the first retrieval was too narrow, wrong top_k , or the question actually needs two lookups (e.g. \"compare x and y\" needing two separate searches), the model has no way to ask for more. it just answers with what it got, or says insufficient_context . tool calling gives the model a menu of functions it's allowed to invoke , described to it as a schema (name, description, json parameters) — not code, just a spec. the model doesn't execute anything. it outputs a structured request like {\"name\": \"retrieve\", \"arguments\": {\"query\": \"supernova types\"}} . your code is the one that actually runs retrieve() , and feeds the result back in as another message. the model then continues, possibly calling another tool, until it decides it has enough to answer in plain text. plain version: the model is a customer at a counter, not the cook. it doesn't walk into the kitchen — it places an order in a fixed format, and you bring back what it asked for. it never touches the stove. where it would slot into the real code two places, and the seam is worth naming precisely: 1. the llm client contract. cloudllmclient.generate() in cloud_client.py currently makes one messages.create() call with system + prompt and returns plain text. tool calling needs the anthropic tools=[...] parameter added to that call, and the return type widened from str to \"either a text answer, or a tool-use request with a name and arguments\" — the llmclient interface itself changes shape. 2. the control loop. nothing in docsmind/ currently loops on a model's response — ragpipeline.query() calls the llm exactly once. the loop (call model → check if it asked for a tool → run the tool → call model again) is new machinery. that loop, plus a registry of callable tools ( retrieve , maybe web_search , code_exec ), is what docsmind/agent/__init__.py — today just a docstring — is a placeholder for. # sketch of the shape, not real code yet tools = [{ \"name\" : \"retrieve\" , \"description\" : \"...\" , \"input_schema\" : {...}}] while true : response = llm.generate_with_tools(system, messages, tools) if response.stop_reason != \"tool_use\" : return response.text # model is done result = tool_registry[response.tool_name](**response.tool_input) messages.append(tool_result_message(response.tool_use_id, result)) trade-offs (the interview meat) cost: every tool call is a full extra round-trip to the llm — more tokens, more latency, and no clean upper bound on how many round-trips a question takes. you need a max-iterations guard or the loop can run forever on an ambiguous question. reliability, not just capability. the hard part isn't wiring the api — it's the model reliably emitting well-formed arguments that match your json schema, every time, including for oddly-phrased questions. this is exactly where closed models are strong and open models often regress — schema drift, malformed json, calling the wrong tool. that gap, and how you close it (better prompting, few-shot examples of correct calls, or constrained decoding — see the interview-depth note below), is the single highest-signal thing to be able to talk through for an inference/serving role. security surface: the model is now choosing what code runs and with what arguments. any tool that touches the filesystem, a shell, or an external api needs its own validation — never trust response.tool_input as safe just because it came from a schema. see 18-llm-security . how you'd validate it: track tool-call success rate separately from answer quality — did the model call the right tool, with valid arguments, in one call rather than three retries? that's a distinct metric from \"was the final answer correct,\" and it's the one that breaks first when you swap models. the interview signals what is tool calling, in one line? the model requests a function by name and arguments; your code executes it and hands the result back — the model never runs anything itself. why can't the model just call the function directly? it has no execution environment. it only emits text (structured as json here). every \"action\" an llm takes in the world is actually your code, triggered by a message it wrote. what's the failure mode that actually shows up in production? not \"the model refuses to use a tool\" — it's malformed or wrong-tool calls , especially after swapping to a smaller or open-weight model. this is a known, measurable regression (see 15-llm-serving-internals for the serving side and the docsmind roadmap's auric-target note on this exact gap) — the fix path is prompting first, then structured-output constraints (outlines/xgrammar), then fine-tuning as a last resort, in that order of cost.","words":911},{"path":"13-mcp/README.md","title":"MCP — A USB Port for Tools","section":"13 · MCP","quiz":false,"accent":"","html":"<h1 id=\"mcp-a-usb-port-for-tools-not-another-way-to-call-them-concept-phase-5\">MCP — a USB port for tools, not another way to call them (concept, Phase 5)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> the same seam as <a class=\"mdlink\" data-href=\"../12-tool-calling/README.md\" href=\"#\"><code>12-tool-calling<\/code><\/a> — the model-asks-your-code-answers loop inside Generate. MCP doesn't change <em>what<\/em> happens at that seam. It changes <em>how the tool list gets there<\/em> and <em>who maintains it<\/em>. Read the tool-calling doc first; this one only makes sense as a delta on top of it.<\/p>\n<pre><code>without MCP:  your app hardcodes a Python function + a hand-written JSON\n              schema for every tool, one at a time, per project.\n\nwith MCP:     your app ← (MCP client, one protocol) ← MCP server (retrieve,\n              web_search, github, slack, ...) — any MCP server plugs into any\n              MCP client, no custom glue per pair.<\/code><\/pre>\n<h2 id=\"the-problem-it-solves\">The problem it solves<\/h2>\n<p>Tool calling (previous doc) needs a schema — name, description, JSON parameters — for every function the model can invoke. Without a standard, each tool integration is bespoke: your <code>retrieve<\/code> schema, someone else's <code>send_email<\/code> schema, all written by hand, all living inside whichever app wired them up. If you build ten agent projects, you write the same \"GitHub tool,\" \"Slack tool,\" \"filesystem tool\" schema-plus-glue-code ten times, and nobody else's agent can reuse yours.<\/p>\n<p><strong>MCP (Model Context Protocol)<\/strong> is Anthropic's open standard that separates \"a tool exists and has a schema\" from \"an app wired it up.\" A <strong>server<\/strong> exposes tools (and resources, and prompts) over a common protocol. A <strong>client<\/strong> — any agent framework, any app — speaks that protocol and can use <em>any<\/em> MCP server without custom code per server. It's the same shift USB made over one custom cable per peripheral: one port, one plug shape, every device that follows the standard just works.<\/p>\n<h2 id=\"why-its-gaining-popularity\">Why it's gaining popularity<\/h2>\n<p>Not because it lets you do anything tool calling couldn't already do — it's the same underlying \"model requests, code executes\" loop. It's popular because it <strong>decouples tool authors from agent authors<\/strong>. A company can write one MCP server for \"our internal ticketing system\" once, and every team's agent — regardless of framework (LangGraph, CrewAI, a bespoke loop) — can use it by speaking the protocol, instead of every team writing its own integration against that ticketing API.<\/p>\n<h2 id=\"where-it-would-slot-into-docsmind\">Where it would slot into DocsMind<\/h2>\n<p>Concretely: DocsMind's own <code>retrieve<\/code> capability could be exposed as an MCP <strong>server<\/strong> — wrapping <code>HybridRetriever.retrieve()<\/code> in <code class=\"srcref\" title=\"source file in the repo\"><code>retriever.py<\/code><\/code> behind the protocol — so that <em>any<\/em> MCP-speaking agent (not just DocsMind's own LangGraph agent in <code>docsmind/agent/<\/code>) could call into DocsMind's retrieval without knowing anything about FAISS, BM25, or RRF fusion underneath. That's the pitch: the retrieval internals stay hidden behind one schema, reusable outside this repo.<\/p>\n<p>Today, if Phase 5's agent needs <code>retrieve<\/code> as a tool, the fastest path is still the hand-written schema from <code>12-tool-calling<\/code> — MCP is worth adopting once there's a <em>second<\/em> consumer of that tool, or a <em>third-party<\/em> tool (GitHub, Slack, a filesystem) you don't want to hand-write a schema for.<\/p>\n<h2 id=\"trade-offs-the-interview-meat\">Trade-offs (the interview meat)<\/h2>\n<ul><li><strong>It's not a new capability, it's a distribution mechanism.<\/strong> Don't answer<\/li><\/ul>\n<p>\"what is MCP\" with \"it lets LLMs call tools\" — tool calling already does   that. MCP's contribution is standardizing the <em>packaging<\/em> so tools are   shareable across agent frameworks.<\/p>\n<ul><li><strong>Overhead for a single, in-house tool.<\/strong> If you're the only consumer of<\/li><\/ul>\n<p><code>retrieve<\/code>, wrapping it as an MCP server is extra indirection (a server   process, a transport layer) for no benefit. It pays off once other agents,   other teams, or third-party servers enter the picture.<\/p>\n<ul><li><strong>Trust boundary.<\/strong> An MCP server run by someone else is code you didn't<\/li><\/ul>\n<p>write, executing with whatever permissions your client grants it. The same   caution in <code>18-llm-security<\/code> about not trusting tool arguments applies   doubly here — you're also trusting the <em>server's<\/em> implementation now, not   just the model's request.<\/p>\n<ul><li><strong>How you'd validate it's worth adopting:<\/strong> count how many places the same<\/li><\/ul>\n<p>tool schema would otherwise be duplicated. One reuse point, marginal. Three   agents across two frameworks needing the same tool, MCP earns its keep.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>What is MCP, in one line?<\/strong> A standard protocol so any agent framework can<\/li><\/ul>\n<p>use any tool server without custom integration glue — same idea as USB   standardizing the plug, not the electricity.<\/p>\n<ul><li><strong>How is it different from function/tool calling?<\/strong> Tool calling is the<\/li><\/ul>\n<p><em>mechanic<\/em> (model requests, code executes). MCP is the <em>packaging<\/em> around   that mechanic — a shared schema/transport so the tool-provider and the   agent-builder don't have to be the same team, or write bespoke glue per pair.<\/p>\n<ul><li>**When would you <em>not<\/em> reach for it?** A single in-house tool with one<\/li><\/ul>\n<p>consumer — hand-write the schema, ship it, don't add a protocol layer you   don't need yet.<\/p>","toc":[{"level":2,"id":"the-problem-it-solves","text":"The problem it solves"},{"level":2,"id":"why-its-gaining-popularity","text":"Why it's gaining popularity"},{"level":2,"id":"where-it-would-slot-into-docsmind","text":"Where it would slot into DocsMind"},{"level":2,"id":"trade-offs-the-interview-meat","text":"Trade-offs (the interview meat)"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"mcp — a usb port for tools, not another way to call them (concept, phase 5) where in the pipeline: the same seam as 12-tool-calling — the model-asks-your-code-answers loop inside generate. mcp doesn't change what happens at that seam. it changes how the tool list gets there and who maintains it . read the tool-calling doc first; this one only makes sense as a delta on top of it. without mcp: your app hardcodes a python function + a hand-written json schema for every tool, one at a time, per project. with mcp: your app ← (mcp client, one protocol) ← mcp server (retrieve, web_search, github, slack, ...) — any mcp server plugs into any mcp client, no custom glue per pair. the problem it solves tool calling (previous doc) needs a schema — name, description, json parameters — for every function the model can invoke. without a standard, each tool integration is bespoke: your retrieve schema, someone else's send_email schema, all written by hand, all living inside whichever app wired them up. if you build ten agent projects, you write the same \"github tool,\" \"slack tool,\" \"filesystem tool\" schema-plus-glue-code ten times, and nobody else's agent can reuse yours. mcp (model context protocol) is anthropic's open standard that separates \"a tool exists and has a schema\" from \"an app wired it up.\" a server exposes tools (and resources, and prompts) over a common protocol. a client — any agent framework, any app — speaks that protocol and can use any mcp server without custom code per server. it's the same shift usb made over one custom cable per peripheral: one port, one plug shape, every device that follows the standard just works. why it's gaining popularity not because it lets you do anything tool calling couldn't already do — it's the same underlying \"model requests, code executes\" loop. it's popular because it decouples tool authors from agent authors . a company can write one mcp server for \"our internal ticketing system\" once, and every team's agent — regardless of framework (langgraph, crewai, a bespoke loop) — can use it by speaking the protocol, instead of every team writing its own integration against that ticketing api. where it would slot into docsmind concretely: docsmind's own retrieve capability could be exposed as an mcp server — wrapping hybridretriever.retrieve() in retriever.py behind the protocol — so that any mcp-speaking agent (not just docsmind's own langgraph agent in docsmind/agent/ ) could call into docsmind's retrieval without knowing anything about faiss, bm25, or rrf fusion underneath. that's the pitch: the retrieval internals stay hidden behind one schema, reusable outside this repo. today, if phase 5's agent needs retrieve as a tool, the fastest path is still the hand-written schema from 12-tool-calling — mcp is worth adopting once there's a second consumer of that tool, or a third-party tool (github, slack, a filesystem) you don't want to hand-write a schema for. trade-offs (the interview meat) it's not a new capability, it's a distribution mechanism. don't answer \"what is mcp\" with \"it lets llms call tools\" — tool calling already does that. mcp's contribution is standardizing the packaging so tools are shareable across agent frameworks. overhead for a single, in-house tool. if you're the only consumer of retrieve , wrapping it as an mcp server is extra indirection (a server process, a transport layer) for no benefit. it pays off once other agents, other teams, or third-party servers enter the picture. trust boundary. an mcp server run by someone else is code you didn't write, executing with whatever permissions your client grants it. the same caution in 18-llm-security about not trusting tool arguments applies doubly here — you're also trusting the server's implementation now, not just the model's request. how you'd validate it's worth adopting: count how many places the same tool schema would otherwise be duplicated. one reuse point, marginal. three agents across two frameworks needing the same tool, mcp earns its keep. the interview signals what is mcp, in one line? a standard protocol so any agent framework can use any tool server without custom integration glue — same idea as usb standardizing the plug, not the electricity. how is it different from function/tool calling? tool calling is the mechanic (model requests, code executes). mcp is the packaging around that mechanic — a shared schema/transport so the tool-provider and the agent-builder don't have to be the same team, or write bespoke glue per pair. **when would you not reach for it?** a single in-house tool with one consumer — hand-write the schema, ship it, don't add a protocol layer you don't need yet.","words":768},{"path":"14-agent-architectures/README.md","title":"Agent Architectures — One Loop vs Many","section":"14 · Agent Architectures","quiz":false,"accent":"","html":"<h1 id=\"agent-architectures-one-loop-vs-many-and-whos-in-charge-concept-phase-5\">Agent architectures — one loop vs many, and who's in charge (concept, Phase 5)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> wraps <em>around<\/em> the whole Retrieve → Generate → Cite path, not inside it. Today <code>RAGPipeline.query()<\/code> is the entire \"agent\" — one retrieve, one generate, no decision-making. This doc is about what replaces that single function once Phase 5 gives the system a planning loop, and — separately — whether that loop is one agent or several talking to each other. Framework choice (<code>docsmind/agent/<\/code>) and architecture pattern (single vs multi-agent) are two different questions; keep them separate.<\/p>\n<pre><code>today (Phase 1-3):     question → retrieve → generate → answer   (no loop)\n\nsingle agent (Phase 5): question → [ plan → tool? → observe → plan → ... ] → answer\n                                     ▲ one LLM, one loop, DocsMind's target shape\n\nmulti-agent:            question → supervisor → routes to sub-agent(s) → merge → answer\n                                     ▲ several LLM loops, one deciding who goes next<\/code><\/pre>\n<h2 id=\"framework-comparison-langchain-vs-llamaindex-vs-langgraph-vs-crewai\">Framework comparison: LangChain vs LlamaIndex vs LangGraph vs CrewAI<\/h2>\n<p>These solve different layers — comparing them head-to-head is a category error interviewers use to check if you actually understand the stack, not just the brand names.<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>Framework<\/th><th>What it actually is<\/th><th>Where DocsMind uses it<\/th><\/tr><\/thead><tbody><tr><td><strong>LlamaIndex<\/strong><\/td><td>Ingestion/indexing toolkit — loaders, chunkers, index abstractions<\/td><td><code>docsmind/ingestion/<\/code> (<code>SimpleDirectoryReader<\/code>, <code>SentenceSplitter<\/code>)<\/td><\/tr><tr><td><strong>LangChain<\/strong><\/td><td>General-purpose LLM app toolkit — prompt templates, chains, many integrations<\/td><td>Not used; DocsMind calls the Anthropic SDK directly (see <code>pipeline-questions.md<\/code> in <code>08-interview-prep<\/code> for why)<\/td><\/tr><tr><td><strong>LangGraph<\/strong><\/td><td>A <em>graph<\/em> execution engine for stateful, cyclic control flow — the loop itself<\/td><td><code>docsmind/agent/<\/code> — this is the loop-builder for Phase 5<\/td><\/tr><tr><td><strong>CrewAI<\/strong><\/td><td>A multi-agent framework — pre-built \"roles,\" a \"crew\" of agents delegating tasks<\/td><td>Not used in DocsMind; relevant only if the <em>multi-agent<\/em> pattern below is chosen<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The one-line version to give in an interview: LlamaIndex answers \"how do I get documents into an index,\" LangChain answers \"how do I compose LLM calls and integrations quickly,\" LangGraph answers \"how do I model a loop or branching decision as an explicit graph with state,\" and CrewAI answers \"how do I get several role-playing agents cooperating out of the box.\" DocsMind picked LlamaIndex (ingestion) + LangGraph (the coming agent loop) deliberately, because a <strong>single agent with an explicit, inspectable loop<\/strong> is the right shape for DocsMind's problem — see the pattern comparison below for why.<\/p>\n<h2 id=\"pattern-comparison-single-agent-vs-multi-agent-vs-supervisor\">Pattern comparison: single agent vs multi-agent vs supervisor<\/h2>\n<p><strong>Single agent:<\/strong> one LLM, one loop, a set of tools (see <code>12-tool-calling<\/code>). It plans, calls a tool, sees the result, and decides again — until it answers. This is what <code>docsmind/agent/<\/code> is a stub for.<\/p>\n<p><strong>Multi-agent (peer):<\/strong> several agents, each with a narrower toolset/prompt, passing messages to each other directly. Harder to reason about — nothing is globally in charge, so failure loops (two agents endlessly deferring to each other) are easy to create and hard to debug.<\/p>\n<p><strong>Supervisor-agent:<\/strong> one \"supervisor\" LLM whose only job is <em>routing<\/em> — decide which specialist sub-agent (or tool) should handle this step — and each sub-agent reports back to the supervisor, never to each other directly. This is the pattern most production multi-agent systems converge on, because it keeps a single point of control and a single place to look when something goes wrong.<\/p>\n<p>Plain version: a single agent is one person doing research, writing, and fact-checking themself, switching hats as needed. A peer multi-agent system is three people passing a document back and forth with no editor. A supervisor-agent system is the same three people, but with an editor who decides who works on the doc next and reviews what comes back.<\/p>\n<h2 id=\"where-it-would-slot-into-the-real-code\">Where it would slot into the real code<\/h2>\n<p><code>docsmind/agent/__init__.py<\/code> is today just a docstring: <em>\"Placeholder for the LangGraph agent: planning loop with retrieve / web_search / code_exec / cite tools and anti-hallucination guardrails.\"<\/em> That's a <strong>single-agent<\/strong> design — one LangGraph loop, several tools, no sub-agents. For DocsMind's actual problem (answer questions from one document corpus, with citations), that's the right call: there's one job, not several specialist roles that would benefit from a supervisor splitting work across them.<\/p>\n<p>If DocsMind later added, say, a separate \"web search agent\" and a \"code-execution agent\" with genuinely different tool access and prompting needs, <em>then<\/em> a supervisor pattern would earn its complexity. Reaching for multi-agent before you have more than one distinct role is adding graph complexity with no matching problem.<\/p>\n<h2 id=\"trade-offs-the-interview-meat\">Trade-offs (the interview meat)<\/h2>\n<ul><li><strong>Single agent is easier to debug.<\/strong> One trace, one loop, one place to look<\/li><\/ul>\n<p>when the answer is wrong. Multi-agent multiplies the places a failure can   hide — was it agent A's tool call, agent B's interpretation of A's output,   or the supervisor's routing decision?<\/p>\n<ul><li><strong>Multi-agent's real cost is coordination, not compute.<\/strong> Every hop between<\/li><\/ul>\n<p>agents is a full LLM call reinterpreting another LLM's output in natural   language — a lossy channel. Each additional agent is a place meaning can   drift.<\/p>\n<ul><li><strong>When multi-agent actually wins:<\/strong> genuinely distinct specialties with<\/li><\/ul>\n<p>different tools/prompts/context windows, where a single agent's system   prompt would become an unmanageable pile of \"if this kind of question, act   like X; if that kind, act like Y.\"<
