er-class gpus.","words":982},{"path":"20-production-monitoring/README.md","title":"Production Monitoring — Cost, Latency, Quality, Drift","section":"20 · Production Monitoring","quiz":false,"accent":"","html":"<h1 id=\"monitoring-an-llm-app-in-production-cost-latency-quality-drift-concept-phase-7\">Monitoring an LLM app in production — cost, latency, quality, drift (concept, Phase 7)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> wraps the <strong>entire<\/strong> pipeline as a cross-cutting concern, the same way logging wraps every function in a normal backend — it's not one stage, it's instrumentation <em>on<\/em> every stage. DocsMind has exactly one piece of this already wired up; everything else is <code>docsmind/ops/<\/code>, today a one-line docstring: <em>\"Ops layer (Phase 7): Dockerfile, k8s manifests, Langfuse/MLflow wiring.\"<\/em><\/p>\n<pre><code>ingest → chunk → embed → index → [ query → embed → search → rerank →\n                                    filter → generate → cite → EVAL ]\n           ▲                                    ▲                ▲\n      already measured:                   already measured:   not built:\n   05-faiss benchmark.py             pipeline.py: latency_ms   RAGAS/drift/\n   (recall/latency/memory)           on every QueryResponse    cost dashboards<\/code><\/pre>\n<h2 id=\"whats-already-measured-vs-what-isnt\">What's already measured vs what isn't<\/h2>\n<p>Every <code>QueryResponse<\/code> returned by <code>RAGPipeline.query()<\/code> in <code class=\"srcref\" title=\"source file in the repo\"><code>pipeline.py<\/code><\/code> already carries a <code>latency_ms<\/code> field, computed with <code>time.perf_counter()<\/code> around the whole retrieve+generate call. That's real, already-shipped instrumentation — just not yet <em>collected<\/em> anywhere beyond the single response object. The retrieval eval (<code>scripts/retrieval_eval.py<\/code>) separately measures Hit@1/MRR, but as an offline script you run by hand, not a live production dashboard. Turning \"a number exists in one response\" and \"a script you run manually\" into \"a monitored system\" is exactly what Phase 7 (<code>docsmind/ops/<\/code>) is a placeholder for.<\/p>\n<h2 id=\"the-four-things-to-track-and-why-each-is-a-different-axis\">The four things to track, and why each is a different axis<\/h2>\n<p><strong>Cost.<\/strong> Tokens in + tokens out, per request, priced per model. Not optional to track per-call — a single runaway prompt (huge retrieved context, a loop that retries too many times) can spike spend invisibly if you only look at monthly totals. Track cost <em>per request<\/em> so an outlier is attributable to a specific query pattern, not buried in an average.<\/p>\n<p><strong>Latency.<\/strong> Already partially there via <code>latency_ms<\/code> — but a single average hides the story. Track <strong>p50/p95/p99<\/strong>, not just mean: a mean can look fine while 1% of users wait 10x longer, often because they hit the reranker (<code>rerank_enabled=True<\/code>) or a cold model load. Break it down by pipeline stage (retrieval vs generation) the way the FAISS benchmark already breaks down latency by index type — an aggregate \"query took 2s\" tells you nothing about <em>where<\/em> the 2s went.<\/p>\n<p><strong>Quality.<\/strong> The hardest of the four, because \"quality\" isn't observable from logs alone the way latency and cost are — it needs an eval signal. Phase 6 (RAGAS/DeepEval, faithfulness/groundedness scoring — not yet built) is what would turn quality from \"spot-checking answers by hand\" into a tracked metric over time.<\/p>\n<p><strong>Drift.<\/strong> Two different kinds, worth naming separately: <strong>data drift<\/strong> (the incoming questions or corpus start looking different from what the system was built/eval'd on — new topics, different phrasing patterns) and <strong>model drift<\/strong> (a provider silently updates a model version behind an API, or an on-disk model file changes, and behavior shifts with no code change on your side). Both are invisible unless you're comparing production traffic patterns and eval scores against a baseline over time, not just at launch.<\/p>\n<h2 id=\"where-this-would-slot-into-the-real-code\">Where this would slot into the real code<\/h2>\n<ul><li><strong>Cost + latency:<\/strong> a lightweight event emitted from <code>RAGPipeline.query()<\/code><\/li><\/ul>\n<p>— same call site that already computes <code>latency_ms<\/code> — sent to something   like Langfuse (traces LLM calls specifically) rather than generic app logs,   because LLM observability tools understand tokens/cost/prompt-versioning   natively.<\/p>\n<ul><li><strong>Quality:<\/strong> Phase 6's RAGAS harness, run periodically against a fixed<\/li><\/ul>\n<p>golden set (the retrieval eval's <code>data/eval/retrieval_queries.json<\/code> is the   precedent) <em>and<\/em> sampled live traffic, tracked over time rather than   once.<\/p>\n<ul><li><strong>Drift:<\/strong> comparing the distribution of live queries/scores against the<\/li><\/ul>\n<p>eval baseline on a schedule — this is genuinely unplanned/frontier for   DocsMind today, closer to an MLOps concern than a RAG one.<\/p>\n<h2 id=\"trade-offs-the-interview-meat\">Trade-offs (the interview meat)<\/h2>\n<ul><li><strong>You cannot monitor quality the way you monitor latency.<\/strong> Latency and<\/li><\/ul>\n<p>cost are directly observable from any request. Quality requires either   human review (doesn't scale) or an LLM-as-judge eval (RAGAS-style) — which   is itself a model call with its own cost and its own failure modes (a judge   model can be wrong too). This asymmetry is <em>why<\/em> Phase 6 is scoped as a   separate, harder phase rather than bundled into basic ops.<\/p>\n<ul><li><strong>Averages actively hide the problems worth knowing about.<\/strong> A flat p50<\/li><\/ul>\n<p>latency chart while p99 climbs is the single most common way a real   incident goes unnoticed until users complain.<\/p>\n<ul><li>**Drift detection needs a stable baseline to drift <em>from<\/em>** — which means<\/li><\/ul>\n<p>the eval set (Phase 3's retrieval eval, Phase 6's future answer eval) isn't   just a one-time validation step, it's the reference point ongoing   monitoring compares against. Skipping eval now means monitoring later has   nothing to measure drift against.<\/p>\n<ul><li><strong>How you'd validate the monitoring itself works:<\/strong> inject a known<\/li><\/ul>\n<p>regression (swap in a deliberately worse model, or a corrupted index) and   confirm the dashboards actually flag it — monitoring you haven't fire-tested   is a false sense of safety.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>What would you track for an LLM app in production, beyond \"is it up\"?<\/strong><\/li><\/ul>\n<p>Cost per request, latency at p95/p99 (not just mean), a recurring quality   eval against a golden set, and drift in both incoming traffic and   model/provider behavior — four different signals, not one dashboard number.<\/p>\n<ul><li><strong>Why isn't quality monitored the same way as latency?<\/strong> Latency is<\/li><\/ul>\n<p>directly measurable from any request; quality needs a judgment (human or   LLM-as-judge) against a reference, which is itself imperfect and costs   money to run continuously.<\/p>\n<ul><li><strong>What's the difference between data drift and model drift?<\/strong> Data drift<\/li><\/ul>\n<p>is your <em>inputs<\/em> changing (new question patterns, corpus changes); model   drift is the <em>model's behavior<\/em> changing under you — often silently, via a   provider-side update — with no code change on your end to explain it.<\/p>","toc":[{"level":2,"id":"whats-already-measured-vs-what-isnt","text":"What's already measured vs what isn't"},{"level":2,"id":"the-four-things-to-track-and-why-each-is-a-different-axis","text":"The four things to track, and why each is a different axis"},{"level":2,"id":"where-this-would-slot-into-the-real-code","text":"Where this would slot into the real code"},{"level":2,"id":"trade-offs-the-interview-meat","text":"Trade-offs (the interview meat)"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"monitoring an llm app in production — cost, latency, quality, drift (concept, phase 7) where in the pipeline: wraps the entire pipeline as a cross-cutting concern, the same way logging wraps every function in a normal backend — it's not one stage, it's instrumentation on every stage. docsmind has exactly one piece of this already wired up; everything else is docsmind/ops/ , today a one-line docstring: \"ops layer (phase 7): dockerfile, k8s manifests, langfuse/mlflow wiring.\" ingest → chunk → embed → index → [ query → embed → search → rerank → filter → generate → cite → eval ] ▲ ▲ ▲ already measured: already measured: not built: 05-faiss benchmark.py pipeline.py: latency_ms ragas/drift/ (recall/latency/memory) on every queryresponse cost dashboards what's already measured vs what isn't every queryresponse returned by ragpipeline.query() in pipeline.py already carries a latency_ms field, computed with time.perf_counter() around the whole retrieve+generate call. that's real, already-shipped instrumentation — just not yet collected anywhere beyond the single response object. the retrieval eval ( scripts/retrieval_eval.py ) separately measures hit@1/mrr, but as an offline script you run by hand, not a live production dashboard. turning \"a number exists in one response\" and \"a script you run manually\" into \"a monitored system\" is exactly what phase 7 ( docsmind/ops/ ) is a placeholder for. the four things to track, and why each is a different axis cost. tokens in + tokens out, per request, priced per model. not optional to track per-call — a single runaway prompt (huge retrieved context, a loop that retries too many times) can spike spend invisibly if you only look at monthly totals. track cost per request so an line on a schedule — this is genuinely unplanned/frontier for docsmind today, closer to an mlops concern than a rag one. trade-offs (the interview meat) you cannot monitor quality the way you monitor latency. latency and cost are directly observable from any request. quality requires either human review (doesn't scale) or an llm-as-judge eval (ragas-style) — which is itself a model call with its own cost and its own failure modes (a judge model can be wrong too). this asymmetry is why phase 6 is scoped as a separate, harder phase rather than bundled into basic ops. averages actively hide the problems worth knowing about. a flat p50 latency chart while p99 climbs is the single most common way a real incident goes unnoticed until users complain. **drift detection needs a stable baseline to drift from ** — which means the eval set (phase 3's retrieval eval, phase 6's future answer eval) isn't just a one-time validation step, it's the reference point ongoing monitoring compares against. skipping eval now means monitoring later has nothing to measure drift against. how you'd validate the monitoring itself works: inject a known regression (swap in a deliberately worse model, or a corrupted index) and confirm the dashboards actually flag it — monitoring you haven't fire-tested is a false sense of safety. the interview signals what would you track for an llm app in production, beyond \"is it up\"? cost per request, latency at p95/p99 (not just mean), a recurring quality eval against a golden set, and drift in both incoming traffic and model/provider behavior — four different signals, not one dashboard number. why isn't quality monitored the same way as latency? latency is directly measurable from any request; quality needs a judgment (human or llm-as-judge) against a reference, which is itself imperfect and costs money to run continuously. what's the difference between data drift and model drift? data drift is your inputs changing (new question patterns, corpus changes); model drift is the model's behavior changing under you — often silently, via a provider-side update — with no code change on your end to explain it.","words":934},{"path":"21-multimodal-document-rag/README.md","title":"Multimodal Document RAG — PDFs, Tables, Scans, Charts","section":"21 · Multimodal Document RAG","quiz":false,"accent":"","html":"<h1 id=\"enterprise-rag-over-pdfs-tables-scans-and-charts-system-design-roadmap\">Enterprise RAG over PDFs, tables, scans, and charts (system design, roadmap)<\/h1>\n<p><strong>Where in the pipeline:<\/strong> almost entirely the <strong>Ingest<\/strong> stage — before chunking even starts. DocsMind's whole pipeline downstream of ingestion (chunk → embed → index → retrieve → generate) is content-agnostic; it doesn't care whether text arrived from a <code>.md<\/code> file or a scanned PDF, as long as ingestion produced clean text. The entire system-design question below is \"what has to happen before <code>load_documents()<\/code> can hand clean text to the rest of the pipeline you've already built.\"<\/p>\n<pre><code>today:   .md/.txt/.rst/.py files → SimpleDirectoryReader → plain text → chunk...\n\nneeded:  PDF w/ tables → layout-aware parser → table → markdown/text\n         PDF w/ scans  → OCR                 → text\n         PDF w/ charts → vision model        → text description\n                                    ↓ (all converge here)\n                              same chunk → embed → index → ... pipeline<\/code><\/pre>\n<h2 id=\"why-this-is-an-ingest-stage-problem-not-a-new-architecture\">Why this is an ingest-stage problem, not a new architecture<\/h2>\n<p>The interviewer's question sounds like it wants a totally different system. It doesn't. Once any of these document types has been converted into clean text (or text-with-structure-preserved, for tables), everything DocsMind already has — chunking, hybrid retrieval, rerank, citation, the <code>INSUFFICIENT_CONTEXT<\/code> guardrail — applies unchanged. The actual design work is entirely about <strong>getting from \"a scanned PDF\" to \"text\"<\/strong> without losing the information that made the document useful in the first place.<\/p>\n<p><code>load_documents()<\/code> in <code class=\"srcref\" title=\"source file in the repo\"><code>loaders.py<\/code><\/code> today does exactly one thing: <code>SimpleDirectoryReader<\/code> over a fixed <code>SUPPORTED_EXTS = [\".md\", \".txt\", \".rst\", \".py\"]<\/code> — plain text files where \"read the bytes as text\" <em>is<\/em> the whole extraction problem. None of the document types in this question fit that model.<\/p>\n<h2 id=\"four-content-types-four-different-extraction-problems\">Four content types, four different extraction problems<\/h2>\n<p><strong>Tables.<\/strong> Naive text extraction turns a table into a wall of numbers with lost row/column structure — a chunk containing raw scraped table text is close to useless for retrieval or the LLM to reason over. A layout-aware parser (e.g. <code>unstructured<\/code>, Azure Document Intelligence, LlamaIndex's own table-aware loaders) needs to reconstruct the table as structured data first, then serialize it to markdown or a text form that preserves which number belongs to which row/column header before it ever reaches the chunker.<\/p>\n<p><strong>Scanned documents.<\/strong> No text layer exists at all — it's an image of a page. <strong>OCR<\/strong> (Tesseract, or a cloud OCR API) is a mandatory first step, and OCR quality directly caps everything downstream: a misread character becomes a wrong fact retrieval will confidently serve up, with no way for later pipeline stages to know it was ever wrong. Garbage in at this stage is invisible garbage everywhere after it.<\/p>\n<p><strong>Charts and images.<\/strong> There's no \"text\" to extract — a chart's information <em>is<\/em> its visual encoding of data. This needs a <strong>vision-capable model<\/strong> to generate a text <em>description<\/em> of the chart's content (trend, key values, axis labels) before it can enter a text-based retrieval index at all. This is lossy by nature — a description is not the chart — which is a real limitation to name explicitly rather than gloss over.<\/p>\n<p><strong>Regular digital-text PDFs<\/strong> (the easy case, worth naming so you don't overbuild for it) — these already have a text layer; a standard PDF text extractor is enough, no OCR or vision model needed. Detecting <em>which<\/em> case you're in (text layer present vs scanned image vs table-heavy) is itself a necessary routing step before picking an extraction strategy.<\/p>\n<h2 id=\"the-design-stage-by-stage\">The design, stage by stage<\/h2>\n<ol><li><strong>Classify<\/strong> each incoming document/page: has a text layer? contains<\/li><\/ol>\n<p>table-like regions? contains images/charts? (Simple heuristics or a    layout model can do this cheaply before committing to expensive OCR/vision    calls on pages that don't need them.)<\/p>\n<ol><li><strong>Route<\/strong> to the matching extractor per the four cases above — this is<\/li><\/ol>\n<p>the new logic that would replace <code>SimpleDirectoryReader<\/code>'s single-path    assumption in <code>loaders.py<\/code>.<\/p>\n<ol><li><strong>Normalize<\/strong> all four outputs into the same shape (<code>Document<\/code> objects<\/li><\/ol>\n<p>LlamaIndex already expects) so the <em>existing<\/em> chunker, embedder, and index    never need to know which extraction path produced the text.<\/p>\n<ol><li><strong>Everything from chunking onward is unchanged<\/strong> — this is the payoff of<\/li><\/ol>\n<p>DocsMind's <code>VectorStore<\/code>/<code>LLMClient<\/code> abstraction pattern applied one layer    earlier: isolate the messy, format-specific part behind a clean interface,    keep the rest of the system oblivious to it.<\/p>\n<h2 id=\"trade-offs-and-failure-modes-the-interview-meat\">Trade-offs and failure modes (the interview meat)<\/h2>\n<ul><li><strong>OCR errors are silent and compound.<\/strong> A wrong digit in a scanned<\/li><\/ul>\n<p>financial table becomes a confidently-cited wrong fact three stages later   — there's no guardrail downstream that can detect \"this text was probably   misread,\" so accuracy has to be won at the OCR stage itself (or flagged   with a confidence score carried alongside the text for later filtering).<\/p>\n<ul><li><strong>Chart-to-text is inherently lossy<\/strong> — be upfront about this rather than<\/li><\/ul>\n<p>implying vision models \"solve\" charts. A generated description captures   what the model noticed, not the full information in the image; retrieval   over that description inherits its gaps.<\/p>\n<ul><li><strong>Cost and latency stack per extraction type.<\/strong> OCR and vision-model calls<\/li><\/ul>\n<p>are expensive relative to reading a <code>.md<\/code> file — a real system needs the   classify-then-route step precisely to avoid running OCR/vision on the   (common) documents that don't need it.<\/p>\n<ul><li><strong>Scalability and security both live at ingestion too.<\/strong> At real enterprise<\/li><\/ul>\n<p>scale, this becomes a queue-based pipeline (documents arrive continuously,   extraction is parallelized across workers) rather than a batch script over   <code>data_dir<\/code>. And if documents carry per-user or per-department access   restrictions, that permission metadata has to be attached at ingestion time   and enforced at retrieval — see the RBAC section in   <a class=\"mdlink\" data-href=\"../18-llm-security/README.md\" href=\"#\"><code>18-llm-security<\/code><\/a>; by the time a chunk is in   the index, it's too late to decide who's allowed to see it.<\/p>\n<ul><li><strong>How you'd validate this actually works:<\/strong> a small labeled eval set of<\/li><\/ul>\n<p>documents-with-known-answers spanning all four types (a table lookup, a   scanned-doc fact, a chart-reading question, a plain-text question) — the   same Hit@1/MRR discipline as <code>09-hybrid-retrieval<\/code>'s eval, just with a   corpus deliberately including the hard cases instead of only clean text.<\/p>\n<h2 id=\"the-interview-signals\">The interview signals<\/h2>\n<ul><li><strong>Why isn't this a new retrieval architecture?<\/strong> Because retrieval,<\/li><\/ul>\n<p>fusion, rerank, and generation are all format-agnostic once ingestion   produces clean text — the entire hard problem is upstream, at extraction,   not in the parts of the pipeline that already generalize.<\/p>\n<ul><li><strong>What's the single biggest risk in this design?<\/strong> Silent extraction<\/li><\/ul>\n<p>errors (bad OCR, a misread table cell) that look like normal, confidently   retrievable text to every downstream stage — there's no guardrail that can   catch \"this fact came from a misread source\" after the fact.<\/p>\n<ul><li>**How do you avoid running expensive extraction (OCR/vision) on every<\/li><\/ul>\n<p>document?** A cheap classification/routing step first — detect which of   the four cases a document is before committing to its (expensive)   extraction path.<\/p>","toc":[{"level":2,"id":"why-this-is-an-ingest-stage-problem-not-a-new-architecture","text":"Why this is an ingest-stage problem, not a new architecture"},{"level":2,"id":"four-content-types-four-different-extraction-problems","text":"Four content types, four different extraction problems"},{"level":2,"id":"the-design-stage-by-stage","text":"The design, stage by stage"},{"level":2,"id":"trade-offs-and-failure-modes-the-interview-meat","text":"Trade-offs and failure modes (the interview meat)"},{"level":2,"id":"the-interview-signals","text":"The interview signals"}],"text":"enterprise rag over pdfs, tables, scans, and charts (system design, roadmap) where in the pipeline: almost entirely the ingest stage — before chunking even starts. docsmind's whole pipeline downstream of ingestion (chunk → embed → index → retrieve → generate) is content-agnostic; it doesn't care whether text arrived from a .md file or a scanned pdf, as lo /* Runtime app — no markdown engine, all content is pre-rendered in DATA. */
const PAGES = DATA.pages;
const byPath = {};
PAGES.forEach(p => byPath[p.path] = p);
let currentPath = null;

// --- live Jupyter playground link (served on the same host, port 8888) ---
const JUPYTER_PORT = 8888;
const JUPYTER_TOKEN = "koireader";   // matches run.sh / koi-jupyter service
function jupyterURL(){
  const proto = location.protocol === "file:" ? "http:" : location.protocol;
  const host = location.hostname || "localhost";
  return proto + "//" + host + ":" + JUPYTER_PORT + "/lab?token=" + JUPYTER_TOKEN;
}

// translucent tint from an accent hex — works on light AND dark backgrounds
function hexToRgba(hex, a){
  hex = (hex||"").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const n = parseInt(hex||"000000", 16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

function resolvePath(curPath, href){
  if(href.charAt(0)==="#") return null;
  if(/\/$/.test(href)) href += "README.md";
  const base = curPath.split("/").slice(0,-1);
  href.split("/").forEach(p=>{
    if(p==="."||p==="") return;
    if(p==="..") base.pop(); else base.push(p);
  });
  return base.join("/");
}

function buildNav(){
  const nav=document.getElementById("nav");
  DATA.nav.forEach(sec=>{
    const wrap=document.createElement("div"); wrap.className="sec";
    wrap.style.setProperty("--card", sec.accent);
    const h=document.createElement("div"); h.className="sec-h";
    h.innerHTML='<span class="sec-ic">'+(sec.icon||"")+'</span> '+sec.label;
    wrap.appendChild(h);
    sec.items.forEach(it=>{
      const a=document.createElement("a");
      a.className="item"+(/README\.md$/.test(it.path)&&it.path.indexOf("/")>=0?" sub":"");
      a.textContent=it.title; a.href="#"+encodeURI(it.path);
      a.dataset.path=it.path;
      wrap.appendChild(a);
    });
    nav.appendChild(wrap);
  });
}

function setActive(path){
  document.querySelectorAll("nav a.item").forEach(a=>a.classList.toggle("active", a.dataset.path===path));
  const pg=byPath[path];
  document.getElementById("tbTitle").textContent = pg ? pg.title : "KoiReader Prep";
}

function renderPageTools(pg){
  const host=document.getElementById("pagetools");
  let html="";
  if(pg.quiz){
    html += '<div class="quizbar">'+
      '<button class="qbtn" id="hideAll">Quiz me · hide answers</button>'+
      '<button class="qbtn" id="showAll">Show all</button>'+
      '<span class="hint">Tap a question to reveal its answer.</span></div>';
  }
  if(pg.toc && pg.toc.length>=3){
    html += '<details class="toc"><summary>On this page</summary><ul>'+
      pg.toc.map(t=>'<li><a class="lvl'+t.level+'" data-anchor="'+t.id+'" href="#">'+t.text+'</a></li>').join("")+
      '</ul></details>';
  }
  host.innerHTML=html;
  if(pg.quiz){
    const set=open=>document.querySelectorAll("#content details.qa").forEach(d=>d.open=open);
    const hb=document.getElementById("hideAll"), sb=document.getElementById("showAll");
    if(hb) hb.onclick=()=>set(false);
    if(sb) sb.onclick=()=>set(true);
  }
}

function renderPager(path){
  const idx=PAGES.findIndex(p=>p.path===path);
  const pager=document.getElementById("pager");
  if(idx<0){ pager.innerHTML=""; return; }
  const prev=PAGES[idx-1], next=PAGES[idx+1];
  let html="";
  if(prev) html+='<a href="#'+encodeURI(prev.path)+'"><div class="lbl">← Previous</div><div class="ttl">'+prev.title+'</div></a>';
  else html+='<div class="spacer"></div>';
  if(next) html+='<a class="next" href="#'+encodeURI(next.path)+'"><div class="lbl">Next →</div><div class="ttl">'+next.title+'</div></a>';
  else html+='<div class="spacer"></div>';
  pager.innerHTML=html;
}

function loadPage(path){
  const pg=byPath[path];
  const content=document.getElementById("content");
  if(!pg){ content.innerHTML='<div class="loading">Page not found: '+path+'</div>'; document.getElementById("pagetools").innerHTML=""; document.getElementById("pager").innerHTML=""; return; }
  currentPath=path;
  setActive(path);
  // tint the page to its section accent (soft tint is translucent → theme-proof)
  const root=document.documentElement.style;
  if(pg.accent){ root.setProperty("--sec-accent", pg.accent); root.setProperty("--sec-accent-soft", hexToRgba(pg.accent, 0.16)); }
  else { root.removeProperty("--sec-accent"); root.removeProperty("--sec-accent-soft"); }
  content.innerHTML=pg.html;
  renderPageTools(pg);
  renderPager(path);
  window.scrollTo(0,0);
  closeSidebar();
}

function go(path){ location.hash="#"+encodeURI(path); }
function onHash(){
  let raw=decodeURI(location.hash.replace(/^#/,""));
  loadPage(raw || "README.md");
}

// internal links + TOC anchors
document.addEventListener("click", e=>{
  const anchor=e.target.closest("a[data-anchor]");
  if(anchor){ e.preventDefault(); const el=document.getElementById(anchor.dataset.anchor); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const a=e.target.closest("a.mdlink");
  if(!a) return;
  const href=a.getAttribute("data-href");
  if(href==="JUPYTER"){ e.preventDefault(); window.open(jupyterURL(), "_blank", "noopener"); return; }
  e.preventDefault();
  const target=resolvePath(currentPath||"README.md", href);
  if(target) go(target);
});

/* ---------------------------------- search --------------------------------- */
const searchBox=document.getElementById("search");
const panel=document.getElementById("searchpanel");
let selIndex=-1, results=[];

function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function snippet(text, q){
  const i=text.indexOf(q); if(i<0) return text.slice(0,120)+"…";
  const s=Math.max(0,i-50), e=Math.min(text.length,i+q.length+70);
  let frag=(s>0?"…":"")+text.slice(s,e)+(e<text.length?"…":"");
  return frag.replace(new RegExp(escRe(q),"ig"), m=>"<mark>"+m+"</mark>");
}
function runSearch(){
  const q=searchBox.value.trim().toLowerCase();
  if(q.length<2){ panel.classList.remove("show"); return; }
  results=PAGES.filter(p=>p.text.indexOf(q)>=0 || p.title.toLowerCase().indexOf(q)>=0).slice(0,40);
  selIndex=-1;
  if(!results.length){ panel.innerHTML='<div class="empty">No matches for “'+q+'”.</div>'; panel.classList.add("show"); return; }
  panel.innerHTML=results.map((p,k)=>
    '<a class="sr" data-k="'+k+'" data-path="'+p.path+'" href="#'+encodeURI(p.path)+'">'+
    '<div class="t">'+p.title+' <span style="color:var(--muted);font-weight:400">· '+p.section+'</span></div>'+
    '<div class="c">'+snippet(p.text,q)+'</div></a>').join("");
  panel.classList.add("show");
}
searchBox.addEventListener("input", runSearch);
searchBox.addEventListener("focus", ()=>{ if(searchBox.value.trim().length>=2) runSearch(); });
panel.addEventListener("click", e=>{ const r=e.target.closest(".sr"); if(r){ e.preventDefault(); go(r.dataset.path); closeSearch(); } });
function closeSearch(){ panel.classList.remove("show"); }
document.addEventListener("click", e=>{ if(!panel.contains(e.target) && e.target!==searchBox && !e.target.closest("#searchBtn")) closeSearch(); });
searchBox.addEventListener("keydown", e=>{
  if(!panel.classList.contains("show")) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); selIndex=Math.min(results.length-1,selIndex+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); selIndex=Math.max(0,selIndex-1); }
  else if(e.key==="Enter"){ e.preventDefault(); if(results[selIndex]){ go(results[selIndex].path); closeSearch(); searchBox.blur(); } return; }
  else if(e.key==="Escape"){ closeSearch(); searchBox.blur(); return; }
  panel.querySelectorAll(".sr").forEach((el,i)=>el.classList.toggle("sel", i===selIndex));
  const sel=panel.querySelector(".sr.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
});

/* --------------------------------- theme ----------------------------------- */
function applyTheme(t){ document.documentElement.dataset.theme=t; try{localStorage.setItem("koi-theme",t);}catch(_){} }
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); }
document.querySelectorAll(".theme-toggle").forEach(b=>b.addEventListener("click",toggleTheme));
(function(){ let t; try{t=localStorage.getItem("koi-theme");}catch(_){}
  if(!t) t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; applyTheme(t); })();

/* ----------------------------- mobile drawer ------------------------------- */
const sidebar=document.getElementById("sidebar"), scrim=document.getElementById("scrim");
function openSidebar(){ sidebar.classList.add("open"); scrim.classList.add("show"); }
function closeSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("menu").addEventListener("click", openSidebar);
document.getElementById("searchBtn").addEventListener("click", ()=>{ openSidebar(); setTimeout(()=>searchBox.focus(),260); });
scrim.addEventListener("click", closeSidebar);
addEventListener("keydown", e=>{ if(e.key==="Escape") closeSidebar(); });

/* --------------------------- live Jupyter button --------------------------- */
(function(){
  const jl=document.getElementById("jupyterLink");
  if(jl){
    jl.href=jupyterURL();
    jl.title="Opens JupyterLab on this device, port "+JUPYTER_PORT+
             " — requires the playground running (bash run.sh, or the koi-jupyter service).";
  }
})();

/* ----------------------------------- init ---------------------------------- */
buildNav();
window.addEventListener("hashchange", onHash);
onHash();

</script>
