AWSTemplateFormatVersion: "2010-09-09"
Description: DocsMind CPU embedding service on ECS with one EC2 capacity provider.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs for the application ALB.
  AllowedCidr:
    Type: String
    Description: Development workstation CIDR allowed to open the DocsMind UI.
  InstanceType:
    Type: String
    Default: m7i.large
  DesiredCapacity:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
  OpenSearchCollectionArn:
    Type: String
    Description: ARN of the OpenSearch Serverless collection used by ingestion.
  OpenSearchCollectionName:
    Type: String
    Default: docsmind-dev
  OpenSearchEndpoint:
    Type: String
    Description: HTTPS endpoint for the OpenSearch Serverless collection.
  OpenSearchIndexName:
    Type: String
    Default: docsmind-volkswagen-wikipedia-bge-m3-v1
  AppImageRepository:
    Type: String
    Default: docsmind-app
  AppImageTag:
    Type: String
    Default: latest
  VllmBaseUrl:
    Type: String
    Default: https://3-93-177-175.sslip.io/v1
  VllmModel:
    Type: String
    Default: openclaw
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  TeiImage:
    Type: String
    Default: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
  EmbeddingModel:
    Type: String
    Default: BAAI/bge-m3
  EmbeddingModelRevision:
    Type: String
    Default: 5617a9f61b028005a4858fdac845db406aefb181

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: docsmind-embedding-dev
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: DocsMind
        - Key: Environment
          Value: development

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/docsmind-embedding-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: DocsMind

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/docsmind-app-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: DocsMind

  VllmApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: docsmind/vllm-api-key
      Description: Bearer token used by the DocsMind app to call the vLLM endpoint.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: DocsMind

  ContainerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsmind-embedding-ecs-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: DocsMind

  ContainerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: docsmind-embedding-ecs-instance
      Roles:
        - !Ref ContainerInstanceRole

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsmind-embedding-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: docsmind-app-secret-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref VllmApiKeySecret
      Tags:
        - Key: Project
          Value: DocsMind

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsmind-app-task
      Description: Read-only runtime identity for the hosted DocsMind query path.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: docsmind-opensearch-query-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Ref OpenSearchCollectionArn
      Tags:
        - Key: Project
          Value: DocsMind
        - Key: Environment
          Value: development

  AppDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: docsmind-app-read
      Type: data
      Description: Read-only access from the DocsMind ECS application.
      Policy: !Sub >-
        [{"Description":"docsmind-app-index-read","Rules":[{"ResourceType":"collection","Resource":["collection/${OpenSearchCollectionName}"],"Permission":["aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${OpenSearchCollectionName}/${OpenSearchIndexName}"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}],"Principal":["${AppTaskRole.Arn}"]}]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IP-restricted HTTP ingress for the DocsMind development UI
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: docsmind-app-dev-alb
        - Key: Project
          Value: DocsMind

  OpenSearchIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsmind-opensearch-ingestion
      Description: Short-lived role for DocsMind OpenSearch ingestion and evaluation.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Policies:
        - PolicyName: docsmind-opensearch-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Ref OpenSearchCollectionArn
      Tags:
        - Key: Project
          Value: DocsMind
        - Key: Environment
          Value: development

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No-ingress security group for the DocsMind embedding host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: docsmind-embedding-dev
        - Key: Project
          Value: DocsMind

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: docsmind-embedding-dev
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ContainerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 40
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_TASK_IAM_ROLE=true" >> /etc/ecs/ecs.config
            mkdir -p /opt/docsmind/huggingface
            chmod 0777 /opt/docsmind/huggingface
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: docsmind-embedding-dev
              - Key: Project
                Value: DocsMind
              - Key: Environment
                Value: development
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: DocsMind

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: docsmind-embedding-dev
      VPCZoneIdentifier:
        - !Ref SubnetId
      TargetGroupARNs:
        - !Ref AppTargetGroup
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: !Ref DesiredCapacity
      HealthCheckType: EC2
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Project
          Value: DocsMind
          PropagateAtLaunch: true
        - Key: Environment
          Value: development
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT5M

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: docsmind-embedding-dev
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedDraining: ENABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
        ManagedTerminationProtection: DISABLED
      Tags:
        - Key: Project
          Value: DocsMind

  CapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders:
        - !Ref CapacityProvider
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 1

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: docsmind-embedding-cpu
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      Volumes:
        - Name: model-cache
          Host:
            SourcePath: /opt/docsmind/huggingface
      ContainerDefinitions:
        - Name: tei
          Image: !Ref TeiImage
          Essential: true
          Cpu: 1800
          MemoryReservation: 6000
          Memory: 7000
          Command:
            - --model-id
            - !Ref EmbeddingModel
            - --revision
            - !Ref EmbeddingModelRevision
            - --dtype
            - float32
            - --pooling
            - cls
            - --port
            - "80"
            - --max-batch-tokens
            - "2048"
            - --max-concurrent-requests
            - "8"
            - --max-client-batch-size
            - "8"
          PortMappings:
            - ContainerPort: 80
              HostPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: model-cache
              ContainerPath: /data
              ReadOnly: false
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -fsS http://localhost:80/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: tei
        - Name: app
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${AppImageRepository}:${AppImageTag}
          Essential: true
          Cpu: 128
          MemoryReservation: 512
          Memory: 768
          DependsOn:
            - ContainerName: tei
              Condition: HEALTHY
          Links:
            - tei:embedding
          PortMappings:
            - ContainerPort: 8000
              HostPort: 8000
              Protocol: tcp
          Environment:
            - Name: DOCSMIND_EMBEDDING_PROVIDER
              Value: tei
            - Name: DOCSMIND_TEI_EMBED_MODEL
              Value: !Ref EmbeddingModel
            - Name: DOCSMIND_TEI_EMBED_DIMENSIONS
              Value: "1024"
            - Name: DOCSMIND_TEI_BASE_URL
              Value: http://embedding:80
            - Name: DOCSMIND_TEI_EMBED_BATCH_SIZE
              Value: "8"
            - Name: DOCSMIND_VECTOR_BACKEND
              Value: opensearch
            - Name: DOCSMIND_OPENSEARCH_ENDPOINT
              Value: !Ref OpenSearchEndpoint
            - Name: DOCSMIND_OPENSEARCH_INDEX
              Value: !Ref OpenSearchIndexName
            - Name: DOCSMIND_AWS_REGION
              Value: !Ref AWS::Region
            - Name: DOCSMIND_AWS_PROFILE
              Value: ""
            - Name: DOCSMIND_INDEX_DIR
              Value: /tmp/docsmind-index
            - Name: DOCSMIND_RETRIEVAL_MODE
              Value: hybrid
            - Name: DOCSMIND_RERANK_ENABLED
              Value: "false"
            - Name: DOCSMIND_LLM_PROVIDER
              Value: vllm
            - Name: DOCSMIND_VLLM_MODEL
              Value: !Ref VllmModel
            - Name: DOCSMIND_VLLM_BASE_URL
              Value: !Ref VllmBaseUrl
            - Name: DOCSMIND_MAX_TOKENS
              Value: "512"
          Secrets:
            - Name: DOCSMIND_VLLM_API_KEY
              ValueFrom: !Ref VllmApiKeySecret
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)" || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Project
          Value: DocsMind
        - Key: Model
          Value: !Ref EmbeddingModel

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: docsmind-app-dev
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /ready
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Project
          Value: DocsMind

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: docsmind-app-dev
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Project
          Value: DocsMind
        - Key: Environment
          Value: development

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - CapacityProviderAssociation
    Properties:
      ServiceName: docsmind-embedding-cpu
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCapacity
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      HealthCheckGracePeriodSeconds: 900
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      PlacementStrategies:
        - Type: spread
          Field: instanceId
      Tags:
        - Key: Project
          Value: DocsMind

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  CapacityProviderName:
    Value: !Ref CapacityProvider
  HostPort:
    Value: "8080"
  Model:
    Value: !Sub "${EmbeddingModel}@${EmbeddingModelRevision}"
  OpenSearchIngestionRoleArn:
    Value: !GetAtt OpenSearchIngestionRole.Arn
  AppTaskRoleArn:
    Value: !GetAtt AppTaskRole.Arn
  AppUrl:
    Value: !Sub http://${AppLoadBalancer.DNSName}
  AppTargetGroupArn:
    Value: !Ref AppTargetGroup
  VllmApiKeySecretArn:
    Value: !Ref VllmApiKeySecret
